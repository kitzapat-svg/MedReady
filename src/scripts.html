<script>
/**
 * MedReady - Client-side Application Controller
 * Handles Navigation, Real-time Sync, State Machine Interactions, and IPD Intranet Integration.
 */

const App = {
  // Global State
  currentUser: null,
  currentScreen: 'auth-loading',
  cases: [],
  notifications: [],
  syncedIpdOrders: [],
  selectedCaseId: null,
  pharmacyFilter: 'ALL',
  pollTimer: null,
  isRefreshing: false,

  /**
  webAppUrl: 'https://script.google.com/macros/s/AKfycbzuKdmZAvBMl854yaqDJha8z0NxOo_sRBK0daPKrkWJEli7QlJI3_QOoyPsPpGrQorI/exec',

  /**
   * Application Entry Point
   */
  init: function() {
    // If user has already logged in previously on this browser, stay logged in across Refresh (F5)
    if (localStorage.getItem('medready_logged_in') === 'true') {
      this.checkAuth();
    } else {
      // First visit / Logged out: show Google Sign-In landing card
      this.showLogin();
    }
  },

  /**
   * Check Auth & Initialize Role Views seamlessly
   */
  checkAuth: function() {
    this.handleGoogleSignIn(true);
  },

  /**
   * Show Google Sign-In Screen
   */
  showLogin: function(res) {
    const sidebar = document.getElementById('main-sidebar');
    if (sidebar) {
      sidebar.classList.add('hidden');
      sidebar.classList.remove('md:flex');
    }
    const topBar = document.getElementById('top-bar');
    if (topBar) topBar.classList.add('hidden');
    const bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.classList.add('hidden');

    this.hideAllViews();
    const loginView = document.getElementById('view-login');
    if (loginView) loginView.classList.remove('hidden');
    this.currentScreen = 'login';
  },

  /**
   * Handle Click on "Sign in with Google" Button / Seamless Auth Check
   * @param {boolean} [isSilentRefresh=false]
   */
  handleGoogleSignIn: function(isSilentRefresh) {
    this.hideAllViews();
    const loadingView = document.getElementById('view-auth-loading');
    if (loadingView) loadingView.classList.remove('hidden');
    this.currentScreen = 'auth-loading';

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      // Local/Standalone preview: display Google Login screen
      App.showToast('โหมดแสดงผลตัวอย่าง (Preview Mode)', 'info');
      App.showLogin();
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.webAppUrl) {
          App.webAppUrl = res.webAppUrl;
        }

        if (res && res.authenticated && res.active && res.status !== 'ACCESS_DENIED' && res.status !== 'ACCOUNT_DEACTIVATED') {
          // Remember logged-in session across page refreshes (F5)
          localStorage.setItem('medready_logged_in', 'true');
          App.currentUser = res;
          App.setupUserInterface();
        } else if (res && (!res.active || res.status === 'ACCESS_DENIED' || res.status === 'ACCOUNT_DEACTIVATED')) {
          localStorage.removeItem('medready_logged_in');
          App.showAuthDenied(res);
        } else {
          // Unauthenticated or needs account selection
          localStorage.removeItem('medready_logged_in');
          if (isSilentRefresh) {
            App.showLogin(res);
            return;
          }
          const canonicalUrl = App.webAppUrl || 'https://script.google.com/macros/s/AKfycbzuKdmZAvBMl854yaqDJha8z0NxOo_sRBK0daPKrkWJEli7QlJI3_QOoyPsPpGrQorI/exec';
          const targetUrl = 'https://accounts.google.com/AccountChooser?service=wise&continue=' + encodeURIComponent(canonicalUrl);
          try {
            if (window.top && window.top !== window) {
              window.top.location.href = targetUrl;
              return;
            }
          } catch (e) {}
          window.location.href = targetUrl;
        }
      })
      .withFailureHandler(function(err) {
        localStorage.removeItem('medready_logged_in');
        App.showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message, 'error');
        App.showAuthDenied({ message: err.message, email: '-' });
      })
      .apiGetCurrentUser();
  },

  /**
   * Google Logout Action
   */
  handleGoogleLogout: function() {
    localStorage.removeItem('medready_logged_in');
    const targetUrl = 'https://accounts.google.com/Logout';
    try {
      if (window.top && window.top !== window) {
        window.top.location.href = targetUrl;
        return;
      }
    } catch (e) {}
    window.location.href = targetUrl;
  },

  /**
   * Open Account Switch / User Profile Modal
   */
  openAccountModal: function() {
    const modal = document.getElementById('modal-account-switch');
    if (!modal) return;
    const user = this.currentUser || {};
    const emailEl = document.getElementById('account-modal-email');
    if (emailEl) emailEl.textContent = user.email || '-';
    const roleEl = document.getElementById('account-modal-role');
    if (roleEl) roleEl.textContent = user.role || '-';
    const wardEl = document.getElementById('account-modal-ward');
    if (wardEl) wardEl.textContent = user.wardScope || '-';
    modal.classList.remove('hidden');
  },

  /**
   * Close Account Switch Modal
   */
  closeAccountModal: function() {
    const modal = document.getElementById('modal-account-switch');
    if (modal) modal.classList.add('hidden');
  },

  /**
   * Switch Account / Sign Out Action
   */
  handleSignOut: function() {
    this.openAccountModal();
  },

  /**
   * Render User Shell based on Role
   */
  setupUserInterface: function() {
    const user = this.currentUser;
    
    // Set user profile info
    const nameEl = document.getElementById('user-display-name');
    if (nameEl) nameEl.textContent = user.name || user.email;
    const roleEl = document.getElementById('user-role-badge');
    if (roleEl) roleEl.textContent = user.role + (user.wardScope ? ' • ' + user.wardScope : '');

    // Show desktop sidebar (hidden on mobile screens, flex on md+ desktop screens), top bar & bottom nav
    const sidebar = document.getElementById('main-sidebar');
    if (sidebar) {
      sidebar.classList.add('hidden', 'md:flex');
    }
    const topBar = document.getElementById('top-bar');
    if (topBar) topBar.classList.remove('hidden');
    const bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.classList.remove('hidden');

    // Role-specific nav adjustments
    if (user.role === 'WARD') {
      document.querySelectorAll('.nav-pharmacy-only').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-admin-only').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-ward-only').forEach(el => el.classList.remove('hidden'));
      
      const wardScopeBadge = document.getElementById('ward-scope-badge');
      if (wardScopeBadge) wardScopeBadge.textContent = user.wardScope || 'ตึกพิเศษ';
      
      this.setupSendPatientWardField();
      this.navigate('ward-dashboard');
    } else if (user.role === 'PHARMACY') {
      document.querySelectorAll('.nav-ward-only').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-admin-only').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-pharmacy-only').forEach(el => el.classList.remove('hidden'));

      this.setupSendPatientWardField();
      this.navigate('pharmacy-dashboard');
    } else if (user.role === 'SUPER_ADMIN') {
      document.querySelectorAll('.nav-ward-only').forEach(el => el.classList.remove('hidden'));
      document.querySelectorAll('.nav-pharmacy-only').forEach(el => el.classList.remove('hidden'));
      document.querySelectorAll('.nav-admin-only').forEach(el => el.classList.remove('hidden'));

      this.setupSendPatientWardField();
      this.navigate('pharmacy-dashboard');
    }

    // Load initial settings & ward list to populate dropdowns
    this.loadInitialWardOptions();

    // Start background polling (every 15 seconds)
    this.startPolling(15000);
    this.refreshData();
  },

  /**
   * Show Access Denied View
   */
  showAuthDenied: function(res) {
    const sidebar = document.getElementById('main-sidebar');
    if (sidebar) {
      sidebar.classList.add('hidden');
      sidebar.classList.remove('md:flex');
    }
    const topBar = document.getElementById('top-bar');
    if (topBar) topBar.classList.add('hidden');
    const bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.classList.add('hidden');

    this.hideAllViews();
    const deniedView = document.getElementById('view-auth-denied');
    if (deniedView) deniedView.classList.remove('hidden');
    this.currentScreen = 'auth-denied';

    if (res) {
      const emailEl = document.getElementById('denied-email');
      if (emailEl) emailEl.textContent = res.email || '-';
      
      const msgEl = document.getElementById('denied-message');
      if (msgEl && res.message) msgEl.textContent = res.message;
      
      const statusEl = document.getElementById('denied-status');
      if (statusEl) {
        if (res.status === 'ACCOUNT_DEACTIVATED') {
          statusEl.textContent = 'บัญชีถูกระงับการใช้งาน';
        } else if (res.status === 'ACCESS_DENIED') {
          statusEl.textContent = 'ยังไม่อยู่ใน Allowlist';
        } else {
          statusEl.textContent = res.status || 'ไม่มีสิทธิ์เข้าใช้งาน';
        }
      }

      const titleEl = document.getElementById('denied-title');
      if (titleEl) {
        if (res.status === 'ACCOUNT_DEACTIVATED') {
          titleEl.textContent = 'บัญชีถูกระงับการใช้งาน';
        } else {
          titleEl.textContent = 'ไม่มีสิทธิ์เข้าใช้งาน';
        }
      }
    }
  },

  /**
   * Hide all screen views
   */
  hideAllViews: function() {
    const views = [
      'view-login', 'view-auth-loading', 'view-auth-denied', 'view-ward-dashboard', 
      'view-pharmacy-dashboard', 'view-board', 'view-send-patient', 
      'view-analytics', 'view-admin'
    ];
    views.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
  },

  /**
   * Screen Navigation Router
   */
  navigate: function(screenId) {
    this.hideAllViews();

    // Update active nav links
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute('data-screen') === screenId) {
        link.classList.add('bg-[#f0edef]', 'text-[#0059b5]', 'font-semibold');
      } else {
        link.classList.remove('bg-[#f0edef]', 'text-[#0059b5]', 'font-semibold');
      }
    });

    const targetEl = document.getElementById('view-' + screenId);
    if (targetEl) {
      targetEl.classList.remove('hidden');
      this.currentScreen = screenId;

      // Screen-specific triggers
      if (screenId === 'send-patient') {
        this.setupSendPatientWardField();
        this.loadIpdSyncedOrders();
      } else if (screenId === 'ward-dashboard') {
        this.renderWardDashboard();
      } else if (screenId === 'pharmacy-dashboard') {
        this.renderPharmacyDashboard();
      } else if (screenId === 'board') {
        this.renderBoard();
      } else if (screenId === 'analytics') {
        this.loadAnalytics();
        this.loadDailySummaryHistory();
      } else if (screenId === 'admin') {
        this.loadAdmin();
      }
    }
  },

  /**
   * Background Polling
   */
  startPolling: function(intervalMs) {
    if (this.pollTimer) clearInterval(this.pollTimer);
    this.pollTimer = setInterval(() => {
      App.refreshData(false);
    }, intervalMs || 15000);
  },

  /**
   * Refresh all live operational data
   */
  refreshData: function(manualTrigger) {
    if (this.isRefreshing) return;
    this.isRefreshing = true;

    if (manualTrigger) {
      this.showToast('กำลังรีเฟรชข้อมูล...', 'info');
    }

    google.script.run
      .withSuccessHandler(function(res) {
        App.isRefreshing = false;
        if (res && res.success && res.data) {
          App.cases = res.data;
          App.renderCurrentScreen();
          if (manualTrigger) App.showToast('อัปเดตข้อมูลล่าสุดเรียบร้อย', 'success');
        }
      })
      .withFailureHandler(function(err) {
        App.isRefreshing = false;
        if (manualTrigger) App.showToast('ไม่สามารถรีเฟรชข้อมูล: ' + err.message, 'error');
      })
      .apiListCases();

    // Check notifications
    this.loadNotifications();
  },

  /**
   * Render view according to active screen
   */
  renderCurrentScreen: function() {
    if (this.currentScreen === 'ward-dashboard') {
      this.renderWardDashboard();
    } else if (this.currentScreen === 'pharmacy-dashboard') {
      this.renderPharmacyDashboard();
    } else if (this.currentScreen === 'board') {
      this.renderBoard();
    }
  },

  // =========================================================================
  // 1. IPD INTRANET SYNC INTEGRATION (Send Patient Page)
  // =========================================================================

  /**
   * Loads synced discharge orders from IPD_Orders sheet (synced via Python from 192.168.0.197)
   */
  loadIpdSyncedOrders: function(manual) {
    const container = document.getElementById('ipd-sync-container');
    const badge = document.getElementById('ipd-sync-count-badge');
    if (!container) return;

    if (manual) {
      container.innerHTML = `
        <div class="p-6 text-center text-xs text-[#86868b] bg-[#fcf8fb] rounded-lg border border-dashed border-[#e4e2e4]">
          <div class="w-5 h-5 border-2 border-[#0071e3]/30 border-t-[#0071e3] rounded-full animate-spin mx-auto mb-2"></div>
          กำลังโหลดรายการใบสั่งยากลับบ้านจาก Intranet...
        </div>
      `;
    }

    const currentWard = this.currentUser ? this.currentUser.wardScope : null;

    google.script.run
      .withSuccessHandler(function(res) {
        console.log('[MedReady IPD Sync Response]:', res);
        if (res && res.success && res.data) {
          App.syncedIpdOrders = res.data.orders || [];
          App.renderIpdSyncedOrders(res.data);
          if (manual) App.showToast('ดึงข้อมูล Sync จาก Intranet สำเร็จ (' + App.syncedIpdOrders.length + ' รายการ)', 'success');
        } else {
          container.innerHTML = `
            <div class="p-4 text-center text-xs text-[#86868b] bg-[#fcf8fb] rounded-lg">
              ${res && res.message ? res.message : 'ไม่พบรายการ Sync จาก Intranet'}
            </div>
          `;
          if (badge) badge.textContent = '0';
        }
      })
      .withFailureHandler(function(err) {
        console.error('[MedReady IPD Sync Error]:', err);
        container.innerHTML = `
          <div class="p-4 text-center text-xs text-[#ba1a1a] bg-[#ffdad6]/40 rounded-lg">
            เกิดข้อผิดพลาดในการโหลดข้อมูล Sync: ${err.message}
          </div>
        `;
      })
      .apiGetIpdSyncedOrders(currentWard);
  },

  /**
   * Renders the IPD Intranet Synced Orders cards
   */
  renderIpdSyncedOrders: function(data) {
    const container = document.getElementById('ipd-sync-container');
    const badge = document.getElementById('ipd-sync-count-badge');
    if (!container) return;

    const orders = data.orders || [];
    if (badge) badge.textContent = orders.length;

    if (orders.length === 0) {
      container.innerHTML = `
        <div class="p-5 text-center text-xs text-[#86868b] bg-[#fcf8fb] rounded-lg border border-dashed border-[#e4e2e4]">
          <span class="material-symbols-outlined text-2xl text-[#86868b] mb-1 block">task_alt</span>
          ไม่พบรายการใบสั่งยากลับบ้านใหม่จาก Intranet ในขณะนี้<br>
          <span class="text-[11px] text-[#86868b]/80">(ท่านสามารถกรอก AN และห้องด้านล่างได้ตามปกติ)</span>
        </div>
      `;
      return;
    }

    let html = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 max-h-80 overflow-y-auto p-1">';
    orders.forEach(order => {
      const isAlreadySubmitted = order.isSubmitted;
      const statusPill = isAlreadySubmitted 
        ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-[#28cd41]/10 text-[#28cd41] flex items-center gap-1">
             <span class="material-symbols-outlined text-xs">check_circle</span> ส่งห้องยาแล้ว (${order.existingCase ? order.existingCase.stateThai || '' : ''})
           </span>`
        : `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-[#28cd41] text-white flex items-center gap-1 shadow-xs">
             <span class="material-symbols-outlined text-xs">medication</span> ยากลับบ้าน (HME)
           </span>`;
      const actionBtn = isAlreadySubmitted
        ? `<button type="button" disabled class="px-3.5 py-1.5 text-xs bg-[#f0edef] text-[#86868b] rounded-lg font-medium cursor-not-allowed flex items-center gap-1">
             <span class="material-symbols-outlined text-xs">done_all</span> ส่งแล้ว
           </button>`
        : `<button id="ipd-btn-${order.rawAn}" type="button" onclick="App.selectIpdOrder('${order.rawAn}', '${order.roomBed}', '${order.ward || ''}')" 
             class="px-3.5 py-1.5 text-xs bg-[#0071e3] hover:bg-[#0059b5] text-white rounded-lg font-medium flex items-center gap-1 shadow-sm transition-all">
             <span class="material-symbols-outlined text-xs">arrow_forward</span> ดึงข้อมูลส่งเคส
           </button>`;

      let displayTime = order.orderTime || '';
      // Clean display time
      if (displayTime.includes('GMT') || displayTime.includes('1899')) {
        const match = displayTime.match(/(\d{1,2}:\d{2})/);
        displayTime = match ? match[1] + ' น.' : '';
      } else if (displayTime && !displayTime.includes('น.')) {
        displayTime = displayTime.substring(0, 5) + ' น.';
      }

      html += `
        <div id="ipd-card-${order.rawAn}" class="p-4 bg-white border ${isAlreadySubmitted ? 'border-[#e4e2e4] bg-[#fcf8fb] opacity-70' : 'border-[#0071e3]/30 hover:border-[#0071e3]'} rounded-xl shadow-xs space-y-3 transition-all">
          <div class="flex items-center justify-between gap-2">
            <span class="font-bold text-sm text-[#1b1b1d] font-mono tracking-wide">${order.maskedAn}</span>
            ${statusPill}
          </div>
          
          <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-[#414753] pt-0.5">
            <div class="flex items-center gap-1.5 font-medium text-[#1b1b1d]">
              <span class="text-[#86868b]">•</span>
              <span class="text-[#0059b5] font-semibold">${order.ward ? order.ward + ' / ' : ''}${order.roomBed || 'ไม่ระบุห้อง'}</span>
            </div>
            ${displayTime ? `
              <div class="flex items-center gap-1 text-[#86868b]">
                <span class="material-symbols-outlined text-xs">schedule</span>
                <span>${displayTime}</span>
              </div>
            ` : ''}
          </div>

          <div class="pt-2 border-t border-[#e4e2e4]/60 flex items-center justify-end">
            ${actionBtn}
          </div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
  },

  /**
   * One-click selection from IPD Intranet Synced list into the Send Patient form
   */
  selectIpdOrder: function(rawAn, roomBed, ward) {
    const anInput = document.getElementById('send-an');
    const roomInput = document.getElementById('send-room-bed');
    const badge = document.getElementById('selected-from-sync-badge');
    const selectEl = document.getElementById('send-ward-select');

    if (anInput) {
      anInput.value = rawAn;
      this.formatAnPreview(rawAn);
    }
    if (roomInput) {
      roomInput.value = roomBed || '';
    }
    if (ward && selectEl && !selectEl.classList.contains('hidden')) {
      for (let i = 0; i < selectEl.options.length; i++) {
        if (selectEl.options[i].value === ward || ward.includes(selectEl.options[i].value) || selectEl.options[i].value.includes(ward)) {
          selectEl.selectedIndex = i;
          break;
        }
      }
    }
    if (badge) {
      badge.classList.remove('hidden');
    }

    // Grey out and disable this specific card button immediately to prevent duplicate clicks
    const btn = document.getElementById('ipd-btn-' + rawAn);
    const card = document.getElementById('ipd-card-' + rawAn);
    if (btn) {
      btn.disabled = true;
      btn.className = 'px-3.5 py-1.5 text-xs bg-[#f0edef] text-[#86868b] rounded-lg font-medium cursor-not-allowed flex items-center gap-1';
      btn.innerHTML = '<span class="material-symbols-outlined text-xs">check</span> เลือกแล้ว';
    }
    if (card) {
    }

    this.showToast(`เลือกข้อมูล AN: ${rawAn} (${ward ? ward + ' ' : ''}ห้อง ${roomBed}) แล้ว`, 'success');
  },

  /**
   * Formats AN mask preview live
   */
  formatAnPreview: function(val) {
    const preview = document.getElementById('an-mask-preview');
    if (!preview) return;
    const clean = String(val || '').trim();
    if (!clean) {
      preview.textContent = 'AN ••••••••';
      return;
    }
    if (clean.length <= 4) {
      preview.textContent = 'AN •••' + clean;
    } else {
      const prefix = clean.substring(0, 2);
      const suffix = clean.substring(clean.length - 4);
      preview.textContent = 'AN ' + prefix + '•••' + suffix;
    }
  },

  /**
   * Quick Room Selection Button
   */
  selectQuickRoom: function(room) {
    const roomInput = document.getElementById('send-room-bed');
    if (roomInput) {
      roomInput.value = room;
    }
  },

  /**
   * Submits the Send Patient Form
   */
  handleSendPatient: function(e) {
    e.preventDefault();
    const anInput = document.getElementById('send-an');
    const roomInput = document.getElementById('send-room-bed');
    const apptInputs = document.getElementsByName('appointmentStatus');
    const btn = document.getElementById('btn-submit-case');
    const selectEl = document.getElementById('send-ward-select');

    let apptStatus = 'นัดหมายแล้ว';
    for (let r of apptInputs) {
      if (r.checked) {
        apptStatus = r.value;
        break;
      }
    }

    const user = this.currentUser;
    const isLockedToSingleWard = user && user.role === 'WARD' && user.wardScope && user.wardScope !== 'ALL';
    let chosenWard = isLockedToSingleWard
      ? user.wardScope
      : (selectEl && !selectEl.classList.contains('hidden') && selectEl.value ? selectEl.value : (user && user.wardScope && user.wardScope !== 'ALL' ? user.wardScope : 'ตึกพิเศษ'));

    const payload = {
      an: anInput.value.trim(),
      roomBed: roomInput.value.trim(),
      appointmentStatus: apptStatus,
      wardScope: chosenWard
    };

    if (!payload.an || !payload.roomBed) {
      this.showToast('กรุณาระบุ AN และ ห้อง/เตียง ให้ครบถ้วน', 'warning');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span> กำลังส่ง...';

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">send</span> ส่งให้ห้องยา';

        if (res && res.success) {
          App.showToast('ส่งข้อมูลให้ห้องยาเรียบร้อย (' + (res.data ? res.data.caseId : '') + ')', 'success');
          anInput.value = '';
          roomInput.value = '';

  setPharmacyFilter: function(filterKey) {
    this.pharmacyFilter = filterKey;
    document.querySelectorAll('.pharm-tab-btn').forEach(btn => {

  renderPharmacyDashboard: function() {
    const subCount = this.cases.filter(c => c.currentState === 'SUBMITTED').length;
    const inpCount = this.cases.filter(c => c.currentState === 'IN_PROGRESS').length;
    const rdyCount = this.cases.filter(c => c.currentState === 'READY').length;
    const bskCount = this.cases.filter(c => c.currentState === 'BASKET_RECEIVED').length;

    const elSub = document.getElementById('pharm-stat-submitted');
    const elInp = document.getElementById('pharm-stat-inprog');
    const elBsk = document.getElementById('pharm-stat-basket');
    if (elSub) elSub.textContent = subCount;
    if (elInp) elInp.textContent = inpCount;
    if (elBsk) elBsk.textContent = bskCount;

    const tAll = document.getElementById('pharm-tab-count-all');
    const tSub = document.getElementById('pharm-tab-count-sub');
    const tInp = document.getElementById('pharm-tab-count-inp');
    const tRdy = document.getElementById('pharm-tab-count-rdy');
    const tBsk = document.getElementById('pharm-tab-count-bsk');
    if (tAll) tAll.textContent = this.cases.length;
    if (tSub) tSub.textContent = subCount;
    if (tInp) tInp.textContent = inpCount;
    if (tRdy) tRdy.textContent = rdyCount;
    if (tBsk) tBsk.textContent = bskCount;

    const filtered = this.cases.filter(c => {
      if (this.pharmacyFilter === 'ALL') return true;
      return c.currentState === this.pharmacyFilter;
    });

    const container = document.getElementById('pharmacy-queue-cards');
    if (!container) return;

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="p-12 text-center bg-white rounded-xl border border-[#e4e2e4] text-[#86868b] space-y-2">
          <span class="material-symbols-outlined text-4xl text-[#cac4cf] block">inbox</span>
          <p class="text-sm font-medium">ไม่มีรายการเคสในสถานะนี้</p>
        </div>
      `;
      return;
    }

    const stateOrder = {
      'SUBMITTED': 1,
      'IN_PROGRESS': 2,
      'READY': 3,
      'BASKET_RECEIVED': 4,
      'DISPENSED': 5
    };

    let html = '';
    filtered.forEach(c => {
      const currentOrder = stateOrder[c.currentState] || 1;
      const slaClass = c.slaBand === 'BREACHED' ? 'sla-strip-breached' : (c.slaBand === 'APPROACHING' ? 'sla-strip-approaching' : 'sla-strip-normal');
      const slaBadgeClass = c.slaBand === 'BREACHED' ? 'bg-[#ff3b30]/10 text-[#ff3b30]' : (c.slaBand === 'APPROACHING' ? 'bg-[#ff9f0a]/10 text-[#ff9f0a]' : 'bg-[#28cd41]/10 text-[#28cd41]');

      const steps = [
        { label: 'ส่งแล้ว', order: 1 },
        { label: 'กำลังเตรียม', order: 2 },
        { label: 'พร้อมจ่าย', order: 3 },
        { label: 'รับตะกร้า', order: 4 },
        { label: 'จ่ายยา', order: 5 }
      ];

      let stepsHtml = '';
      steps.forEach(st => {
        const isCompleted = currentOrder > st.order || (currentOrder === 5 && st.order === 5);
        const isCurrent = currentOrder === st.order && currentOrder !== 5;
        const stepClass = isCompleted ? 'completed' : (isCurrent ? 'current' : '');
        const dotContent = isCompleted ? '<span class="material-symbols-outlined text-xs">check</span>' : st.order;
        const dotClass = isCompleted ? 'completed' : (isCurrent ? 'current' : 'pending');
        const textClass = isCompleted ? 'text-[#0071e3] font-semibold' : (isCurrent ? 'text-[#1b1b1d] font-bold' : 'text-[#86868b]');

        stepsHtml += `
          <div class="timeline-step flex flex-col items-center flex-1 ${stepClass}">
            <div class="timeline-dot ${dotClass}">${dotContent}</div>
            <span class="text-[10px] mt-1.5 ${textClass} whitespace-nowrap">${st.label}</span>
          </div>
        `;
      });

      const nextBtn = c.nextState ? `
        <button onclick="event.stopPropagation(); App.handleTransitionCase('${c.caseId}', '${c.nextState}', '${c.currentState}')"
          class="w-full sm:w-auto px-4 py-2 bg-[#0071e3] hover:bg-[#0059b5] text-white rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center justify-center gap-1.5 active:scale-95">
          <span>${c.nextActionLabel || 'ดำเนินการต่อ'}</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      ` : `
        <span class="px-3 py-1.5 rounded-lg bg-[#28cd41]/10 text-[#28cd41] text-xs font-semibold flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">done_all</span> จ่ายยาเรียบร้อย
        </span>
      `;

      html += `
        <div onclick="App.openCaseDetail('${c.caseId}')" class="medready-card medready-card-interactive p-5 cursor-pointer ${slaClass} flex flex-col xl:flex-row xl:items-center justify-between gap-5 bg-white shadow-xs hover:shadow-md transition-all">
          <!-- 1. Patient & Case Metadata -->
          <div class="flex-shrink-0 min-w-[200px] space-y-1.5">
            <div class="flex items-center gap-2">
              <span class="font-numeric font-bold text-base text-[#0059b5]">${c.caseId}</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase ${slaBadgeClass}">${c.slaLabel}</span>
            </div>
            <div class="flex items-center gap-1.5 text-xs text-[#1b1b1d] font-medium">
              <span class="material-symbols-outlined text-sm text-[#86868b]">meeting_room</span>
              <span class="font-semibold text-[#0059b5]">${c.wardScope}</span> • <span>${c.roomBed}</span>
            </div>
            <div class="flex items-center gap-2 text-xs text-[#86868b]">
              <span class="font-mono">${c.maskedAn}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#f0edef] text-[#414753]">${c.appointmentStatus || 'นัดหมายแล้ว'}</span>
            </div>
          </div>

          <!-- 2. Interactive 5-Step Timeline -->
          <div class="flex-grow w-full max-w-xl px-2 py-1">
            <div class="flex justify-between w-full relative">
              ${stepsHtml}
            </div>
          </div>

          <!-- 3. Elapsed Time & Primary Action -->
          <div class="flex-shrink-0 flex flex-row xl:flex-col items-center xl:items-end justify-between w-full xl:w-48 gap-3 pt-3 xl:pt-0 border-t xl:border-t-0 border-[#e4e2e4]">
            <div class="text-left xl:text-right">
              <div class="font-numeric font-bold text-sm text-[#1b1b1d]">เวลารวม ${c.elapsedText}</div>
              <div class="text-[10px] text-[#86868b]">ส่งเมื่อ ${c.submittedAt ? new Date(c.submittedAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : '-'}</div>
            </div>
            <div class="shrink-0 w-full sm:w-auto xl:w-full flex justify-end">
              ${nextBtn}
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  },

  // =========================================================================
  // 4. MEDREADY BOARD (Operational Table)
  // =========================================================================
  filterBoard: function() {
    this.renderBoard();
  },

  renderBoard: function() {
    const searchVal = (document.getElementById('board-search')?.value || '').toLowerCase().trim();
    const wardFilter = document.getElementById('board-ward-filter')?.value || 'ALL';
    const stateFilter = document.getElementById('board-state-filter')?.value || 'ALL';

    const cleanDigits = searchVal.replace(/[^0-9a-zA-Z]/g, '');

    const filtered = this.cases.filter(c => {
      if (wardFilter !== 'ALL' && c.wardScope !== wardFilter) return false;
      if (stateFilter === 'ACTIVE' && c.currentState === 'DISPENSED') return false;
      if (stateFilter !== 'ALL' && stateFilter !== 'ACTIVE' && c.currentState !== stateFilter) return false;
      if (searchVal) {
        const caseId = String(c.caseId || '').toLowerCase();
        const rawAn = String(c.rawAn || '').toLowerCase();
        const maskedAn = String(c.maskedAn || '').toLowerCase();
        const roomBed = String(c.roomBed || '').toLowerCase();
        const wardScope = String(c.wardScope || '').toLowerCase();
        const stateThai = String(c.stateThai || '').toLowerCase();
        const apptStatus = String(c.appointmentStatus || '').toLowerCase();

        const match = caseId.includes(searchVal) ||
                      (rawAn && rawAn.includes(searchVal)) ||
                      (cleanDigits && rawAn && rawAn.includes(cleanDigits)) ||
                      maskedAn.includes(searchVal) ||
                      roomBed.includes(searchVal) ||
                      wardScope.includes(searchVal) ||
                      stateThai.includes(searchVal) ||
                      apptStatus.includes(searchVal);
        if (!match) return false;
      }
      return true;
    });

    const tbody = document.getElementById('board-table-body');
    const mobileList = document.getElementById('board-mobile-list');
    const emptyState = document.getElementById('board-empty');

    if (filtered.length === 0) {
      if (tbody) tbody.innerHTML = '';
      if (mobileList) mobileList.innerHTML = '';
      if (emptyState) emptyState.classList.remove('hidden');
      return;
    }

    if (emptyState) emptyState.classList.add('hidden');

    // Desktop Rows
    if (tbody) {
      let html = '';
      filtered.forEach(c => {
        const slaClass = c.slaBand === 'BREACHED' ? 'text-[#ff3b30]' : (c.slaBand === 'APPROACHING' ? 'text-[#ff9f0a]' : 'text-[#28cd41]');
        html += `
          <tr onclick="App.openCaseDetail('${c.caseId}')" class="hover:bg-[#f6f3f5] cursor-pointer transition-colors">
            <td class="py-3 px-4 font-mono font-bold text-[#0059b5]">${c.caseId}</td>
            <td class="py-3 px-4 font-mono">${c.maskedAn}</td>
            <td class="py-3 px-4 font-medium">${c.wardScope} / ${c.roomBed}</td>
            <td class="py-3 px-4">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-[#f0edef] text-[#1b1b1d]">${c.stateThai}</span>
            </td>
            <td class="py-3 px-4 font-mono">${c.elapsedText}</td>
            <td class="py-3 px-4 font-bold text-[11px] ${slaClass}">${c.slaLabel}</td>
            <td class="py-3 px-4 text-right">
              <button class="text-[#0071e3] hover:underline font-medium">ดูเคส</button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // Mobile List
    if (mobileList) {
      let html = '';
      filtered.forEach(c => {
        html += `
          <div onclick="App.openCaseDetail('${c.caseId}')" class="p-4 bg-white cursor-pointer hover:bg-[#f6f3f5] space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="font-mono font-bold text-xs text-[#0059b5]">${c.caseId}</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-[#f0edef] text-[#1b1b1d]">${c.stateThai}</span>
            </div>
            <div class="font-medium text-xs text-[#1b1b1d]">${c.wardScope} / ${c.roomBed} (${c.maskedAn})</div>
            <div class="flex items-center justify-between text-[11px] text-[#86868b]">
              <span>เวลารวม: ${c.elapsedText}</span>
              <span class="font-bold">${c.slaLabel}</span>
            </div>
          </div>
        `;
      });
      mobileList.innerHTML = html;
    }
  },

  // =========================================================================
  // 5. CASE ACTIONS & STATE MACHINE
  // =========================================================================
  handleTransitionCase: function(caseId, targetState, expectedCurrentState) {
    this.showToast('กำลังอัปเดตสถานะ...', 'info');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.showToast(res.message || 'อัปเดตสถานะเรียบร้อย', 'success');
          App.refreshData(false);
          if (App.selectedCaseId === caseId) {
            App.openCaseDetail(caseId);
          }
        } else if (res && res.conflict) {
          document.getElementById('modal-write-conflict').classList.remove('hidden');
          App.refreshData(true);
        } else {
          App.showToast('ไม่สามารถเปลี่ยนสถานะ: ' + (res ? res.error : 'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('ข้อผิดพลาดระบบ: ' + err.message, 'error');
      })
      .apiTransitionCase({
        caseId: caseId,
        targetState: targetState,
        expectedCurrentState: expectedCurrentState
      });
  },

  // =========================================================================
  // 6. CASE DETAIL DRAWER
  // =========================================================================
  openCaseDetail: function(caseId) {
    this.selectedCaseId = caseId;
    const drawer = document.getElementById('case-detail-drawer');
    if (!drawer) return;
    drawer.classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.data) {
          App.renderCaseDetail(res.data);
        }
      })
      .apiGetCaseDetail(caseId);
  },

  closeCaseDetail: function() {
    this.selectedCaseId = null;
    const drawer = document.getElementById('case-detail-drawer');
    if (drawer) drawer.classList.add('hidden');
  },

  renderCaseDetail: function(data) {
    const c = data.case;
    const timeline = data.timeline || [];
    const flags = data.flags || [];

    document.getElementById('drawer-case-id').textContent = c.caseId;
    document.getElementById('drawer-an').textContent = c.maskedAn;
    document.getElementById('drawer-room-bed').textContent = c.roomBed;
    document.getElementById('drawer-ward').textContent = c.wardScope;
    document.getElementById('drawer-appt').textContent = c.appointmentStatus || 'นัดหมายแล้ว';

    const statusPill = document.getElementById('drawer-status-pill');
    statusPill.textContent = c.stateThai;

    // Durations
    document.getElementById('drawer-lead-time').textContent = c.prepLeadText || '-';
    document.getElementById('drawer-wait-time').textContent = c.patientWaitingText || '-';

    // Progress bar
    let progress = 10;
    if (c.currentState === 'IN_PROGRESS') progress = 45;
    else if (c.currentState === 'READY') progress = 75;
    else if (c.currentState === 'BASKET_RECEIVED') progress = 85;
    else if (c.currentState === 'DISPENSED') progress = 100;
    
    document.getElementById('drawer-progress-percent').textContent = progress + '%';
    document.getElementById('drawer-progress-bar').style.width = progress + '%';

    // Issue Flags
    const flagsContainer = document.getElementById('drawer-flags-list');
    if (flags.length === 0) {
      flagsContainer.innerHTML = '<div class="text-xs text-[#86868b] italic">ไม่มีรายการปัญหา</div>';
    } else {
      let html = '';
      flags.forEach(f => {
        html += `
          <div class="px-3 py-1.5 bg-[#ffdad6]/40 border border-[#ffdad6] text-[#ba1a1a] rounded-lg text-xs flex items-center justify-between">
            <span class="font-medium">🚩 ${f.flagType}</span>
            <span class="text-[10px] text-[#414753]">${new Date(f.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
        `;
      });
      flagsContainer.innerHTML = html;
    }

    // Timeline
    const timelineContainer = document.getElementById('drawer-timeline-list');
    let tHtml = '';
    timeline.forEach(t => {
      tHtml += `
        <div class="relative text-xs">
          <div class="w-2.5 h-2.5 rounded-full bg-[#0071e3] absolute -left-[19px] top-1"></div>
          <div class="font-semibold text-[#1b1b1d]">${t.event}</div>
          <div class="text-[11px] text-[#86868b]">${t.actor} • ${new Date(t.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</div>
          ${t.details ? `<div class="text-xs text-[#414753] mt-0.5">${t.details}</div>` : ''}
        </div>
      `;
    });
    timelineContainer.innerHTML = tHtml || '<div class="text-xs text-[#86868b]">ไม่มีประวัติ</div>';

    // Footer action
    const footer = document.getElementById('drawer-footer-actions');
    if (c.nextState && (this.currentUser.role === 'PHARMACY' || this.currentUser.role === 'SUPER_ADMIN')) {
      footer.innerHTML = `
        <button onclick="App.handleTransitionCase('${c.caseId}', '${c.nextState}', '${c.currentState}')"
          class="w-full py-3 bg-[#0071e3] hover:bg-[#0059b5] text-white rounded-lg text-sm font-semibold shadow-sm flex items-center justify-center gap-2">
          <span>${c.nextActionLabel || 'ดำเนินการต่อ'}</span>
          <span class="material-symbols-outlined text-base">arrow_forward</span>
        </button>
      `;
    } else {
      footer.innerHTML = `
        <button onclick="App.closeCaseDetail()" class="w-full py-2.5 bg-[#f0edef] hover:bg-[#e4e2e4] text-[#414753] rounded-lg text-xs font-semibold">
          ปิดหน้าต่าง
        </button>
      `;
    }
  },

  // =========================================================================
  // 7. NOTIFICATIONS & MODALS
  // =========================================================================
  loadNotifications: function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.data) {
          App.notifications = res.data;
          const unreadCount = res.data.filter(n => !n.read).length;
          const badge = document.getElementById('notif-unread-badge');
          if (badge) {
            badge.textContent = unreadCount;
            if (unreadCount > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
          }
          // Refresh list if the drawer is currently open
          const drawer = document.getElementById('notifications-drawer');
          if (drawer && !drawer.classList.contains('hidden')) {
            App.openNotifications();
          }
        }
      })
      .apiListNotifications();
  },

  openNotifications: function() {
    const drawer = document.getElementById('notifications-drawer');
    if (!drawer) return;
    drawer.classList.remove('hidden');

    const list = document.getElementById('notifications-list');
    if (!this.notifications || this.notifications.length === 0) {
      list.innerHTML = `
        <div class="text-center py-12 text-[#86868b] space-y-2">
          <span class="material-symbols-outlined text-4xl text-[#c7c6ca]">notifications_off</span>
          <div class="text-xs">ไม่มีการแจ้งเตือนในขณะนี้</div>
        </div>
      `;
      return;
    }

    let html = '';
    this.notifications.forEach(n => {
      const isUnread = !n.read;
      const cardBg = isUnread 
        ? 'bg-[#0071e3]/6 border-l-4 border-[#0071e3] shadow-xs' 
        : 'bg-[#fcf8fb] border-l-4 border-transparent hover:bg-[#f0edef]/60';
      const titleColor = isUnread ? 'text-[#0071e3] font-semibold' : 'text-[#1b1b1d] font-medium opacity-80';

      html += `
        <div class="group relative p-3.5 my-1.5 rounded-r-xl transition-all cursor-pointer ${cardBg}" onclick="App.clickNotification('${n.notificationId}', '${n.caseId || ''}')">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2">
              ${isUnread ? '<span class="w-2 h-2 rounded-full bg-[#0071e3] inline-block animate-pulse"></span>' : ''}
              <div class="text-xs ${titleColor}">${n.title}</div>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-[10px] text-[#86868b]">${n.timeThai || (n.timestamp ? new Date(n.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '')}</span>
              <button onclick="event.stopPropagation(); App.deleteNotification('${n.notificationId}')" class="opacity-0 group-hover:opacity-100 p-1 text-[#86868b] hover:text-[#ba1a1a] hover:bg-white rounded transition-all" title="ลบการแจ้งเตือนนี้">
                <span class="material-symbols-outlined text-sm">close</span>
              </button>
            </div>
          </div>
          <div class="text-xs text-[#414753] mt-1 whitespace-pre-line leading-relaxed ${isUnread ? '' : 'opacity-75'}">${n.message}</div>
          ${n.caseId ? `
            <div class="mt-2 flex items-center gap-1 text-[11px] font-medium text-[#0071e3] hover:underline">
              <span>ดูรายละเอียดเคส</span>
              <span class="material-symbols-outlined text-xs">arrow_forward</span>
            </div>
          ` : ''}
        </div>
      `;
    });
    list.innerHTML = html;
  },

  closeNotifications: function() {
    const drawer = document.getElementById('notifications-drawer');
    if (drawer) drawer.classList.add('hidden');
  },

  clickNotification: function(notificationId, caseId) {
    // Mark as read locally and on server
    const notif = (this.notifications || []).find(n => n.notificationId === notificationId);
    if (notif && !notif.read) {
      notif.read = true;
      const unreadCount = this.notifications.filter(n => !n.read).length;
      const badge = document.getElementById('notif-unread-badge');
      if (badge) {
        badge.textContent = unreadCount;
        if (unreadCount > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
      }
      google.script.run.apiMarkNotificationsAsRead([notificationId]);
      this.openNotifications();
    }

    // Open case detail modal if caseId is present
    if (caseId) {
      this.closeNotifications();
      this.openCaseDetail(caseId);
    }
  },

  markAllNotificationsRead: function() {
    // Optimistic UI update
    if (this.notifications) {
      this.notifications.forEach(n => n.read = true);
      const badge = document.getElementById('notif-unread-badge');
      if (badge) badge.classList.add('hidden');
      this.openNotifications();
    }
    
    App.showToast('กำลังปรับสถานะการอ่าน...', 'info');
    google.script.run
      .withSuccessHandler(function() {
        App.showToast('อ่านการแจ้งเตือนทั้งหมดเรียบร้อย', 'success');
        App.loadNotifications();
      })
      .withFailureHandler(function(err) {
        App.showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
      })
      .apiMarkAllNotificationsRead();
  },

  deleteNotification: function(notificationId) {
    // Optimistic UI update
    if (this.notifications) {
      this.notifications = this.notifications.filter(n => n.notificationId !== notificationId);
      const unreadCount = this.notifications.filter(n => !n.read).length;
      const badge = document.getElementById('notif-unread-badge');
      if (badge) {
        badge.textContent = unreadCount;
        if (unreadCount > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
      }
      this.openNotifications();
    }

    google.script.run
      .withSuccessHandler(function() {
        App.loadNotifications();
      })
      .withFailureHandler(function(err) {
        App.showToast('ไม่สามารถลบการแจ้งเตือน: ' + err.message, 'error');
      })
      .apiDismissNotification(notificationId);
  },

  deleteAllNotifications: function() {
    if (!confirm('คุณต้องการลบการแจ้งเตือนทั้งหมดของคุณใช่หรือไม่?')) return;
    
    // Optimistic UI update
    this.notifications = [];
    const badge = document.getElementById('notif-unread-badge');
    if (badge) badge.classList.add('hidden');
    this.openNotifications();

    App.showToast('กำลังลบการแจ้งเตือน...', 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.showToast('ลบการแจ้งเตือนทั้งหมดเรียบร้อย', 'success');
          App.loadNotifications();
        } else {
          App.showToast(res.message || 'เกิดข้อผิดพลาดในการลบการแจ้งเตือน', 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
      })
      .apiDeleteAllNotifications();
  },

  // =========================================================================
  // 8. TOAST NOTIFICATION UTILITY
  // =========================================================================
  showToast: function(message, type) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    const bgClass = type === 'error' ? 'bg-[#ba1a1a] text-white' : (type === 'warning' ? 'bg-[#ff9f0a] text-white' : (type === 'success' ? 'bg-[#28cd41] text-white' : 'bg-[#1b1b1d] text-white'));
    
    toast.className = `pointer-events-auto px-4 py-2.5 rounded-lg shadow-lg text-xs font-medium ${bgClass} flex items-center justify-between gap-3 animate-fade-in transition-all`;
    toast.innerHTML = `
      <span>${message}</span>
      <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100"><span class="material-symbols-outlined text-sm">close</span></button>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 4000);
  },

  analyticsFilter: {

  /**
   * Helper to get Thai Fiscal Year (1 Oct - 30 Sep) & Quarters info
   */
  getFiscalYearInfo: function(targetDate) {
    const d = targetDate ? new Date(targetDate) : new Date();
    const year = d.getFullYear();
    const month = d.getMonth() + 1; // 1-12
    let fyCE = year;
    let quarter = 1;

    if (month >= 10) {
      fyCE = year + 1;
      quarter = 1;
    } else if (month <= 3) {
      fyCE = year;
      quarter = 2;
    } else if (month <= 6) {
      fyCE = year;
      quarter = 3;
    } else {
      fyCE = year;
      quarter = 4;
    }

    const fyBE = fyCE + 543;
    return {
      fyCE: fyCE,
      fyBE: fyBE,
      currentQuarter: quarter,
      fyStart: `${fyCE - 1}-10-01`,
      fyEnd: `${fyCE}-09-30`,
      q1: { start: `${fyCE - 1}-10-01`, end: `${fyCE - 1}-12-31`, label: `ไตรมาส 1 ปีงบ ${fyBE} (1 ต.ค. - 31 ธ.ค.)` },
      q2: { start: `${fyCE}-01-01`, end: `${fyCE}-03-31`, label: `ไตรมาส 2 ปีงบ ${fyBE} (1 ม.ค. - 31 มี.ค.)` },
      q3: { start: `${fyCE}-04-01`, end: `${fyCE}-06-30`, label: `ไตรมาส 3 ปีงบ ${fyBE} (1 เม.ย. - 30 มิ.ย.)` },
      q4: { start: `${fyCE}-07-01`, end: `${fyCE}-09-30`, label: `ไตรมาส 4 ปีงบ ${fyBE} (1 ก.ค. - 30 ก.ย.)` }
    };
  },

  /**
   * Set Analytics Date Filter Preset
   */
  setAnalyticsDatePreset: function(preset) {
    this.analyticsFilter.preset = preset;
    const today = new Date();
    const formatDate = (d) => {
      const year = d.getFullYear();
      const month = ('0' + (d.getMonth() + 1)).slice(-2);
      const day = ('0' + d.getDate()).slice(-2);
      return `${year}-${month}-${day}`;
    };

    const todayStr = formatDate(today);
    const startInput = document.getElementById('analytics-start-date');
    const endInput = document.getElementById('analytics-end-date');
    const badgeEl = document.getElementById('analytics-date-badge');
    const periodSelect = document.getElementById('analytics-period-select');
    if (periodSelect) periodSelect.value = '';

    // Reset button styles
    const presetKeys = ['today', 'yesterday', 'week', 'this-month', 'last-month', 'this-quarter', 'this-fiscal-year', 'all'];
    presetKeys.forEach(k => {
      const btn = document.getElementById('btn-preset-' + k);
      if (btn) {
        const isCurrent = (k === 'today' && preset === 'TODAY') ||
                          (k === 'yesterday' && preset === 'YESTERDAY') ||
                          (k === 'week' && preset === 'WEEK') ||
                          (k === 'this-month' && preset === 'THIS_MONTH') ||
                          (k === 'last-month' && preset === 'LAST_MONTH') ||
                          (k === 'this-quarter' && preset === 'THIS_QUARTER') ||
                          (k === 'this-fiscal-year' && preset === 'THIS_FISCAL_YEAR') ||
                          (k === 'all' && preset === 'ALL');
        if (isCurrent) {
          btn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-[#0071e3] text-white transition-colors';
        } else {
          btn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-[#f0edef] text-[#414753] hover:bg-[#e4e2e4] transition-colors';
        }
      }
    });

    const fyInfo = this.getFiscalYearInfo(today);

    if (preset === 'TODAY') {
      this.analyticsFilter.date = todayStr;
      this.analyticsFilter.startDate = '';
      this.analyticsFilter.endDate = '';
      if (startInput) startInput.value = todayStr;
      if (endInput) endInput.value = todayStr;
      if (badgeEl) badgeEl.textContent = 'วันนี้ (' + todayStr + ')';
    } else if (preset === 'YESTERDAY') {
      const y = new Date();
      y.setDate(y.getDate() - 1);
      const yStr = formatDate(y);
      this.analyticsFilter.date = yStr;
      this.analyticsFilter.startDate = '';
      this.analyticsFilter.endDate = '';
      if (startInput) startInput.value = yStr;
      if (endInput) endInput.value = yStr;
      if (badgeEl) badgeEl.textContent = 'เมื่อวาน (' + yStr + ')';
    } else if (preset === 'WEEK') {
      const w = new Date();
      w.setDate(w.getDate() - 6);
      const wStr = formatDate(w);
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = wStr;
      this.analyticsFilter.endDate = todayStr;
      if (startInput) startInput.value = wStr;
      if (endInput) endInput.value = todayStr;
      if (badgeEl) badgeEl.textContent = '7 วันล่าสุด (' + wStr + ' ถึง ' + todayStr + ')';
    } else if (preset === 'THIS_MONTH') {
      const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      const fStr = formatDate(firstDay);
      const lStr = formatDate(lastDay);
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = fStr;
      this.analyticsFilter.endDate = lStr;
      if (startInput) startInput.value = fStr;
      if (endInput) endInput.value = lStr;
      if (badgeEl) badgeEl.textContent = 'เดือนนี้ (' + fStr + ' ถึง ' + lStr + ')';
    } else if (preset === 'LAST_MONTH') {
      const firstDay = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      const lastDay = new Date(today.getFullYear(), today.getMonth(), 0);
      const fStr = formatDate(firstDay);
      const lStr = formatDate(lastDay);
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = fStr;
      this.analyticsFilter.endDate = lStr;
      if (startInput) startInput.value = fStr;
      if (endInput) endInput.value = lStr;
      if (badgeEl) badgeEl.textContent = 'เดือนที่แล้ว (' + fStr + ' ถึง ' + lStr + ')';
    } else if (preset === 'THIS_QUARTER') {
      const qKey = 'q' + fyInfo.currentQuarter;
      const qObj = fyInfo[qKey];
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = qObj.start;
      this.analyticsFilter.endDate = qObj.end;
      if (startInput) startInput.value = qObj.start;
      if (endInput) endInput.value = qObj.end;
      if (badgeEl) badgeEl.textContent = qObj.label;
    } else if (preset === 'THIS_FISCAL_YEAR') {
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = fyInfo.fyStart;
      this.analyticsFilter.endDate = fyInfo.fyEnd;
      if (startInput) startInput.value = fyInfo.fyStart;
      if (endInput) endInput.value = fyInfo.fyEnd;
      if (badgeEl) badgeEl.textContent = `ปีงบประมาณ ${fyInfo.fyBE} (${fyInfo.fyStart} ถึง ${fyInfo.fyEnd})`;
    } else if (preset === 'ALL') {
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = '';
      this.analyticsFilter.endDate = '';
      if (startInput) startInput.value = '';
      if (endInput) endInput.value = '';
      if (badgeEl) badgeEl.textContent = 'ข้อมูลทั้งหมด';
    }

    this.loadAnalytics();
  },

  /**
   * Handle Period Select Dropdown (Quarter, Fiscal Year, Calendar Year)
   */
  onAnalyticsPeriodSelect: function(periodVal) {
    if (!periodVal) return;
    this.analyticsFilter.preset = 'PERIOD_' + periodVal;
    const today = new Date();
    const fyInfo = this.getFiscalYearInfo(today);
    const prevFyInfo = this.getFiscalYearInfo(new Date(today.getFullYear() - 1, 5, 1));
    const startInput = document.getElementById('analytics-start-date');
    const endInput = document.getElementById('analytics-end-date');
    const badgeEl = document.getElementById('analytics-date-badge');

    // Reset presets buttons styling
    const presetKeys = ['today', 'yesterday', 'week', 'this-month', 'last-month', 'this-quarter', 'this-fiscal-year', 'all'];
    presetKeys.forEach(k => {
      const btn = document.getElementById('btn-preset-' + k);
      if (btn) btn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-medium bg-[#f0edef] text-[#414753] hover:bg-[#e4e2e4] transition-colors';
    });

    let sDate = '';
    let eDate = '';
    let label = '';

    if (periodVal === 'FY_Q1') {
      sDate = fyInfo.q1.start;
      eDate = fyInfo.q1.end;
      label = fyInfo.q1.label;
    } else if (periodVal === 'FY_Q2') {
      sDate = fyInfo.q2.start;
      eDate = fyInfo.q2.end;
      label = fyInfo.q2.label;
    } else if (periodVal === 'FY_Q3') {
      sDate = fyInfo.q3.start;
      eDate = fyInfo.q3.end;
      label = fyInfo.q3.label;
    } else if (periodVal === 'FY_Q4') {
      sDate = fyInfo.q4.start;
      eDate = fyInfo.q4.end;
      label = fyInfo.q4.label;
    } else if (periodVal === 'FY_CURRENT') {
      sDate = fyInfo.fyStart;
      eDate = fyInfo.fyEnd;
      label = `ปีงบประมาณ ${fyInfo.fyBE} (${sDate} ถึง ${eDate})`;
    } else if (periodVal === 'FY_PREV') {
      sDate = prevFyInfo.fyStart;
      eDate = prevFyInfo.fyEnd;
      label = `ปีงบประมาณ ${prevFyInfo.fyBE} (${sDate} ถึง ${eDate})`;
    } else if (periodVal === 'CAL_CURRENT') {
      sDate = `${today.getFullYear()}-01-01`;
      eDate = `${today.getFullYear()}-12-31`;
      label = `ปีปฏิทิน ${today.getFullYear() + 543} (${sDate} ถึง ${eDate})`;
    } else if (periodVal === 'CAL_PREV') {
      sDate = `${today.getFullYear() - 1}-01-01`;
      eDate = `${today.getFullYear() - 1}-12-31`;
      label = `ปีปฏิทิน ${today.getFullYear() + 542} (${sDate} ถึง ${eDate})`;
    }

    if (sDate && eDate) {
      this.analyticsFilter.date = '';
      this.analyticsFilter.startDate = sDate;
      this.analyticsFilter.endDate = eDate;
      if (startInput) startInput.value = sDate;
      if (endInput) endInput.value = eDate;
      if (badgeEl) badgeEl.textContent = label;
      this.loadAnalytics();
    }
  },

  /**

   */
  onAnalyticsFilterChanged: function() {
    const wardSelect = document.getElementById('analytics-ward-filter');
    const shiftSelect = document.getElementById('analytics-shift-filter');
    if (wardSelect) this.analyticsFilter.ward = wardSelect.value;
    if (shiftSelect) this.analyticsFilter.shift = shiftSelect.value;
    this.loadAnalytics();
  },

  /**
   * Target Changed (Live Simulation & Policy Recalculation)
   */
  onAnalyticsTargetChanged: function(newTarget) {
    const num = parseInt(newTarget, 10);
    if (!isNaN(num) && num > 0) {
      this.analyticsFilter.targetMinutes = num;
      this.loadAnalytics();
    }
  },

  /**
   * Load Analytics & KPIs
   */
  loadAnalytics: function() {
    // Default to today if first load
    if (!this.analyticsFilter.date && !this.analyticsFilter.startDate && this.analyticsFilter.preset === 'TODAY') {
      const today = new Date();
      const year = today.getFullYear();
      const month = ('0' + (today.getMonth() + 1)).slice(-2);
      const day = ('0' + today.getDate()).slice(-2);
      this.analyticsFilter.date = `${year}-${month}-${day}`;
      const startInput = document.getElementById('analytics-start-date');
      const endInput = document.getElementById('analytics-end-date');
      if (startInput) startInput.value = this.analyticsFilter.date;
      if (endInput) endInput.value = this.analyticsFilter.date;
    }

    const wardSelect = document.getElementById('analytics-ward-filter');
    const shiftSelect = document.getElementById('analytics-shift-filter');
    const targetSelect = document.getElementById('analytics-target-select');

    if (wardSelect && wardSelect.value) this.analyticsFilter.ward = wardSelect.value;
    if (shiftSelect && shiftSelect.value) this.analyticsFilter.shift = shiftSelect.value;
    if (targetSelect && targetSelect.value) this.analyticsFilter.targetMinutes = parseInt(targetSelect.value, 10);

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.data) {
          const kpis = res.data;
          const targetMin = kpis.targetMinutes || 40;

          // Sync Target Select Value if not already selected
          if (targetSelect && String(targetSelect.value) !== String(targetMin)) {
            targetSelect.value = String(targetMin);
          }

          // 1. PRIMARY & SECONDARY 5 CORE KPIS
          const medEl = document.getElementById('kpi-median');
          const p90El = document.getElementById('kpi-p90');
          const p90SubEl = document.getElementById('kpi-p90-sub');
          const withinTargetEl = document.getElementById('kpi-within-target');
          const targetTitleEl = document.getElementById('kpi-target-title');
          const withinTargetSubEl = document.getElementById('kpi-within-target-sub');
          const meanEl = document.getElementById('kpi-mean');
          const compEl = document.getElementById('kpi-completed-cases');
          const totalEl = document.getElementById('kpi-total-cases');

          if (medEl) medEl.textContent = (kpis.median != null ? kpis.median : 0) + ' min';
          if (p90El) p90El.textContent = (kpis.p90 != null ? kpis.p90 : 0) + ' min';
          if (p90SubEl) p90SubEl.textContent = `90% completed within ${kpis.p90 || 0} min`;
          if (withinTargetEl) withinTargetEl.textContent = (kpis.withinTargetPercent != null ? kpis.withinTargetPercent : 100) + '%';
          if (targetTitleEl) targetTitleEl.textContent = `Within Target (≤${targetMin} min)`;
          if (withinTargetSubEl) withinTargetSubEl.textContent = `Within ${targetMin} min: ${kpis.withinTargetCount || 0} เคส (${kpis.withinTargetPercent || 0}%)`;
          if (meanEl) meanEl.textContent = (kpis.mean != null ? kpis.mean : 0) + ' min';
          if (compEl) compEl.textContent = kpis.cases || kpis.completedCases || 0;
          if (totalEl) totalEl.textContent = kpis.totalCases || 0;

          // 2. DETAILED STATISTICS GRID
          const p25El = document.getElementById('stat-p25');
          const medianEl = document.getElementById('stat-median');
          const p75El = document.getElementById('stat-p75');
          const iqrEl = document.getElementById('stat-iqr');
          const sdEl = document.getElementById('stat-sd');
          const minEl = document.getElementById('stat-min');
          const p95El = document.getElementById('stat-p95');
          const maxEl = document.getElementById('stat-max');
          const outlierRangeEl = document.getElementById('stat-outlier-range');
          const outlierCountEl = document.getElementById('stat-outlier-count');
          const invalidCountEl = document.getElementById('stat-invalid-count');

          if (p25El) p25El.textContent = (kpis.p25 != null ? kpis.p25 : 0) + ' min';
          if (medianEl) medianEl.textContent = (kpis.median != null ? kpis.median : 0) + ' min';
          if (p75El) p75El.textContent = (kpis.p75 != null ? kpis.p75 : 0) + ' min';
          if (iqrEl) iqrEl.textContent = (kpis.iqr != null ? kpis.iqr : 0) + ' min';
          if (sdEl) sdEl.textContent = (kpis.sd != null ? kpis.sd : 0) + ' min';
          if (minEl) minEl.textContent = (kpis.min != null ? kpis.min : 0) + ' min';
          if (p95El) p95El.textContent = (kpis.p95 != null ? kpis.p95 : 0) + ' min';
          if (maxEl) maxEl.textContent = (kpis.max != null ? kpis.max : 0) + ' min';

          if (outlierRangeEl && kpis.stats) {
            outlierRangeEl.textContent = `< ${kpis.stats.iqrLowerThreshold} หรือ > ${kpis.stats.iqrUpperThreshold} min`;
          }
          if (outlierCountEl) outlierCountEl.textContent = kpis.outlierCount || 0;
          if (invalidCountEl) invalidCountEl.textContent = kpis.invalidCount || 0;

          // 3. CQI INTERPRETATION HELPERS
          const interpTyp = document.getElementById('interp-typical');
          const interpMid = document.getElementById('interp-middle');
          const interpP90 = document.getElementById('interp-p90');
          const interpTgtLbl = document.getElementById('interp-target-label');
          const interpTgtVal = document.getElementById('interp-target-val');

          if (interpTyp) interpTyp.textContent = `${kpis.median || 0} min`;
          if (interpMid) interpMid.textContent = `${kpis.p25 || 0} – ${kpis.p75 || 0} min`;
          if (interpP90) interpP90.textContent = `${kpis.p90 || 0} min`;
          if (interpTgtLbl) interpTgtLbl.textContent = `Within target ≤${targetMin} min`;
          if (interpTgtVal) interpTgtVal.textContent = `${kpis.withinTargetPercent || 0}%`;

          // 4. SHIFT ANALYTICS
          const shiftEl = document.getElementById('analytics-shift-list');
          if (shiftEl && kpis.shiftBreakdown) {
            let sHtml = '';
            for (const [shiftName, sData] of Object.entries(kpis.shiftBreakdown)) {
              const sStats = sData.stats || {};
              sHtml += `
                <div class="p-3 bg-[#fcf8fb] border border-[#e4e2e4] rounded-lg space-y-1.5">
                  <div class="flex items-center justify-between text-xs font-semibold text-[#1b1b1d]">
                    <span>${shiftName}</span>
                    <span class="font-mono text-[#0059b5]">${sData.count} เคส</span>
                  </div>
                  <div class="grid grid-cols-4 gap-2 text-[11px] text-[#5d5e60] pt-1 border-t border-[#e4e2e4]/60">
                    <div>Median: <span class="font-bold text-[#1b1b1d]">${sStats.median || 0}m</span></div>
                    <div>Mean: <span class="font-medium text-[#1b1b1d]">${sStats.mean || 0}m</span></div>
                    <div>P90: <span class="font-medium text-[#1b1b1d]">${sStats.p90 || 0}m</span></div>
                    <div>Within: <span class="font-bold text-[#28cd41]">${sStats.withinTargetPercent || 0}%</span></div>
                  </div>
                </div>
              `;
            }
            shiftEl.innerHTML = sHtml;
          }

          // 5. WAITING TIME BUCKETS
          const waitBucketEl = document.getElementById('analytics-wait-buckets');
          if (waitBucketEl && kpis.waitingTimeBuckets) {
            const completedCount = kpis.completedCases || 1;
            const b = kpis.waitingTimeBuckets;
            const buckets = [
              { label: 'น้อยกว่า 15 นาที (เร็วมาก)', count: b.under15 || 0, color: 'bg-[#28cd41]', textCol: 'text-[#28cd41]' },
              { label: '15 - 30 นาที (มาตรฐานดีมาก)', count: b.under30 || 0, color: 'bg-[#0071e3]', textCol: 'text-[#0071e3]' },
              { label: '31 - 45 นาที (ใกล้เกณฑ์ SLA)', count: b.under45 || 0, color: 'bg-[#ff9f0a]', textCol: 'text-[#ff9f0a]' },
              { label: 'มากกว่า 45 นาที (เกินเกณฑ์)', count: b.over45 || 0, color: 'bg-[#ff3b30]', textCol: 'text-[#ff3b30]' }
            ];
            let bHtml = '';
            buckets.forEach(item => {
              const pct = completedCount > 0 ? Math.round((item.count / completedCount) * 100) : 0;
              bHtml += `
                <div class="space-y-1">
                  <div class="flex justify-between text-xs">
                    <span class="font-medium text-[#1b1b1d]">${item.label}</span>
                    <span class="font-mono ${item.textCol} font-semibold">${item.count} เคส (${pct}%)</span>
                  </div>
                  <div class="w-full h-2 bg-[#f0edef] rounded-full overflow-hidden">
                    <div class="h-full ${item.color} rounded-full transition-all" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            });
            waitBucketEl.innerHTML = bHtml;
          }

          // 6. WARD ANALYTICS
          const wardListEl = document.getElementById('analytics-ward-list');
          if (wardListEl && kpis.wardStats) {
            let wHtml = '';
            const wards = Object.keys(kpis.wardStats);
            if (wards.length === 0) {
              wHtml = '<div class="text-xs text-[#86868b] text-center py-4">ยังไม่มีข้อมูลเคสแยกตาม Ward</div>';
            } else {
              wards.forEach(w => {
                const wObj = kpis.wardStats[w];
                const wStats = wObj.stats || {};
                wHtml += `
                  <div class="p-3 bg-[#fcf8fb] border border-[#e4e2e4] rounded-lg space-y-1.5">
                    <div class="flex items-center justify-between text-xs font-semibold text-[#1b1b1d]">
                      <span>${w}</span>
                      <span class="font-mono text-[#0059b5]">${wObj.count} เคส</span>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-[11px] text-[#5d5e60] pt-1 border-t border-[#e4e2e4]/60">
                      <div>Median: <span class="font-bold text-[#1b1b1d]">${wStats.median || 0}m</span></div>
                      <div>Mean: <span class="font-medium text-[#1b1b1d]">${wStats.mean || 0}m</span></div>
                      <div>P90: <span class="font-medium text-[#1b1b1d]">${wStats.p90 || 0}m</span></div>
                      <div>Within: <span class="font-bold text-[#28cd41]">${wStats.withinTargetPercent || 0}%</span></div>
                    </div>
                  </div>
                `;
              });
              wardListEl.innerHTML = wHtml;
            }
          }

          // 7. HOURLY BREAKDOWN
          const hourlyEl = document.getElementById('analytics-hourly-list');
          if (hourlyEl && kpis.hourlyBreakdown) {
            const hours = Object.keys(kpis.hourlyBreakdown).sort();
            const total = kpis.totalCases || 1;
            if (hours.length === 0) {
              hourlyEl.innerHTML = '<div class="text-xs text-[#86868b] text-center py-4">ไม่มีข้อมูลเคสในช่วงเวลานี้</div>';
            } else {
              let hHtml = '';
              hours.forEach(h => {
                const count = kpis.hourlyBreakdown[h] || 0;
                const pct = total > 0 ? Math.round((count / total) * 100) : 0;
                hHtml += `
                  <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                      <span class="font-medium text-[#1b1b1d]">${h} น.</span>
                      <span class="font-mono text-[#5d5e60]">${count} เคส (${pct}%)</span>
                    </div>
                    <div class="w-full h-2 bg-[#f0edef] rounded-full overflow-hidden">
                      <div class="h-full bg-[#0071e3] rounded-full transition-all" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              });
              hourlyEl.innerHTML = hHtml;
            }
          }
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('ไม่สามารถโหลดข้อมูลสถิติ: ' + err.message, 'error');
      })
      .apiGetAnalytics(this.analyticsFilter);
  },

  /**
   * Run Daily Archiving & Aggregation
   */
  runDailyArchiving: function() {
    const targetDate = this.analyticsFilter.date || '';
    const dateLabel = targetDate || 'วันนี้';
    if (!confirm(`คุณต้องการประมวลผลสรุปข้อมูลประจำวัน (${dateLabel}) และจัดเก็บประวัติลงในระบบอย่างเป็นทางการใช่หรือไม่?`)) {
      return;
    }

    App.showToast(`กำลังประมวลผลสรุปยอดและจัดเก็บข้อมูล ${dateLabel}...`, 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.showToast(res.message || 'จัดเก็บข้อมูลรายวันสำเร็จ', 'success');
          App.refreshData(false);
          App.loadAnalytics();
          App.loadDailySummaryHistory();
        } else {
          App.showToast('เกิดข้อผิดพลาด: ' + (res ? res.error : 'Unknown'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
      })
      .apiRunDailyArchiving(targetDate);
  },

  /**
   * Export Academic Research Data as CSV
   */
  exportAcademicReport: function(specificDate) {
    const filter = {
      date: specificDate || this.analyticsFilter.date,
      startDate: !specificDate ? this.analyticsFilter.startDate : '',
      endDate: !specificDate ? this.analyticsFilter.endDate : '',
      ward: this.analyticsFilter.ward || 'ALL',
      shift: this.analyticsFilter.shift || 'ALL',
      targetMinutes: this.analyticsFilter.targetMinutes || 40
    };

    App.showToast('กำลังเตรียมข้อมูลสำหรับดาวน์โหลด...', 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.data) {
          const csvContent = res.data.csvContent;
          const filename = res.data.filename || 'MedReady_Discharge_Waiting_Time_Report.csv';
          
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          const url = URL.createObjectURL(blob);
          link.setAttribute('href', url);
          link.setAttribute('download', filename);
          link.style.visibility = 'hidden';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);

          App.showToast(`ดาวน์โหลดข้อมูลสำเร็จ (${res.data.rowCount} เคส)`, 'success');
        } else {
          App.showToast('ไม่สามารถส่งออกข้อมูล: ' + (res ? res.error : 'Unknown'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('ส่งออกข้อมูลล้มเหลว: ' + err.message, 'error');
      })
      .apiExportAcademicData(filter);
  },

  // =========================================================================
  // 10. ADMIN & SETTINGS MANAGEMENT
  // =========================================================================
  adminTab: 'users',
  adminUsers: [],
  adminWards: [],

  /**
   * Helper to format time value to HH:mm string safely
   */
  formatTimeString: function(val, defaultVal) {
    if (!val) return defaultVal || '';
    const str = String(val).trim();
    const match = str.match(/(\d{1,2}):(\d{2})/);
    if (match) {
      return match[1].padStart(2, '0') + ':' + match[2];
    }
    return defaultVal || str;
  },

  /**
   * Switch between Admin sub-navigation tabs (users, wards, settings)
   */
  switchAdminTab: function(tabName) {
    this.adminTab = tabName;

    // Subtab Buttons
    const tabs = ['users', 'wards', 'settings'];
    tabs.forEach(t => {
      const btn = document.getElementById('btn-admin-tab-' + t);
      const section = document.getElementById('admin-section-' + t);
      if (btn) {
        if (t === tabName) {
          btn.className = 'admin-subtab-btn flex items-center gap-2 px-4 py-2.5 text-xs font-semibold border-b-2 border-[#0071e3] text-[#0059b5] transition-all';
        } else {
          btn.className = 'admin-subtab-btn flex items-center gap-2 px-4 py-2.5 text-xs font-semibold border-b-2 border-transparent text-[#5d5e60] hover:text-[#1b1b1d] hover:border-[#d2d2d7] transition-all';
        }
      }
      if (section) {
        if (t === tabName) section.classList.remove('hidden');
        else section.classList.add('hidden');
      }
    });

    if (tabName === 'users') {
      this.loadAdminUsers();
    } else if (tabName === 'wards') {
      this.loadAdminWards();
    } else if (tabName === 'settings') {
      this.loadAdminSettings();
    }
  },

    this.loadAdminUsers();
    this.loadAdminWards();

  /**
   * Opens the User Modal in Edit Mode (prefilled with user data)
   */
  openEditUserModal: function(email) {
    const user = this.adminUsers.find(u => u.email.toLowerCase() === email.toLowerCase());
    if (!user) {
      this.showToast('ไม่พบข้อมูลผู้ใช้งาน', 'warning');
      return;
    }

    const modal = document.getElementById('modal-add-user');
    const titleEl = document.getElementById('modal-user-title');
    const iconEl = document.getElementById('modal-user-icon');
    const emailInput = document.getElementById('modal-user-email');
    const nameInput = document.getElementById('modal-user-name');
    const roleSelect = document.getElementById('modal-user-role');
    const wardSelect = document.getElementById('modal-user-ward');
    const activeCheck = document.getElementById('modal-user-active');
    const isEditInput = document.getElementById('modal-user-is-edit');
    const submitBtn = document.getElementById('btn-save-user-modal');

    if (!modal) return;

    if (titleEl) titleEl.textContent = 'แก้ไขข้อมูลผู้ใช้งาน & สิทธิ์';
    if (iconEl) iconEl.textContent = 'edit';
    if (isEditInput) isEditInput.value = 'true';
    if (submitBtn) submitBtn.textContent = 'บันทึกการแก้ไข';

    if (emailInput) {
      emailInput.value = user.email;
      emailInput.disabled = true; // Email is the identifier
    }
    if (nameInput) nameInput.value = user.name || '';
    if (roleSelect) roleSelect.value = user.role || 'WARD';
    if (activeCheck) activeCheck.checked = user.active;

    // Refresh and select current Ward
    this.populateWardDropdownForModal(user.wardScope);

  /**
   * Handles user creation or update
   */
  handleSaveUser: function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const emailInput = document.getElementById('modal-user-email');
    const nameInput = document.getElementById('modal-user-name');
    const roleSelect = document.getElementById('modal-user-role');
    const wardSelect = document.getElementById('modal-user-ward');
    const activeCheck = document.getElementById('modal-user-active');

    const email = emailInput ? emailInput.value.trim() : '';
    const name = nameInput ? nameInput.value.trim() : '';
    const role = roleSelect ? roleSelect.value : 'WARD';
    const ward = wardSelect ? wardSelect.value : 'ตึกพิเศษ';
    const active = activeCheck ? activeCheck.checked : true;

    if (!email || !role) {
      this.showToast('กรุณาระบุอีเมลและบทบาท (Role)', 'warning');
      return;
    }

    this.showToast('กำลังบันทึกข้อมูลผู้ใช้งาน...', 'info');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.closeAddUserModal();
          App.showToast(res.message || 'บันทึกผู้ใช้เรียบร้อย', 'success');
          App.loadAdminUsers();
        } else {
          App.showToast('เกิดข้อผิดพลาด: ' + (res ? res.error : 'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('บันทึกผู้ใช้ไม่สำเร็จ: ' + err.message, 'error');
      })
      .apiSaveUser({ email, name, role, wardScope: ward, active });
