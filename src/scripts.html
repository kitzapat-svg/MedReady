  /**
   * Saves or Updates Ward
   */
  handleSaveWard: function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const isEdit = document.getElementById('modal-ward-is-edit')?.value === 'true';
    const oldName = document.getElementById('modal-ward-old-name')?.value || '';
    const newName = document.getElementById('modal-ward-name')?.value.trim() || '';
    const isDefault = document.getElementById('modal-ward-is-default')?.checked;

    if (!newName) {
      this.showToast('กรุณาระบุชื่อ Ward / หอผู้ป่วย', 'warning');
      return;
    }
    if (newName.includes(',')) {
      this.showToast('ชื่อ Ward ห้ามมีเครื่องหมายจุลภาค (,)', 'warning');
      return;
    }

    this.showToast('กำลังบันทึก Ward...', 'info');

    if (isEdit) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            if (isDefault) {
              google.script.run.apiSetDefaultWard(newName);
            }
            App.closeWardModal();
            App.showToast(res.message || 'แก้ไขชื่อ Ward สำเร็จ', 'success');
            App.loadAdminWards();
            App.loadAdminUsers();
          } else {
            App.showToast('เกิดข้อผิดพลาด: ' + (res ? res.error : 'Unknown error'), 'error');
          }
        })
        .withFailureHandler(function(err) {
          App.showToast('แก้ไข Ward ไม่สำเร็จ: ' + err.message, 'error');
        })
        .apiUpdateWard(oldName, newName);
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            if (isDefault) {
              google.script.run.apiSetDefaultWard(newName);
            }
            App.closeWardModal();
            App.showToast(res.message || 'เพิ่ม Ward ใหม่สำเร็จ', 'success');
            App.loadAdminWards();
          } else {
            App.showToast('เกิดข้อผิดพลาด: ' + (res ? res.error : 'Unknown error'), 'error');
          }
        })
        .withFailureHandler(function(err) {
          App.showToast('เพิ่ม Ward ไม่สำเร็จ: ' + err.message, 'error');
        })
        .apiAddWard(newName);
    }
  },

  /**
   * Sets up the Ward selection / display on the Send Patient page
   */
  setupSendPatientWardField: function() {
    const user = this.currentUser;
    if (!user) return;

    const displayEl = document.getElementById('send-ward-display');
    const selectEl = document.getElementById('send-ward-select');
    const valEl = document.getElementById('send-ward-value');
    if (!displayEl || !selectEl) return;

    // A user is locked to a single ward ONLY if their role is WARD and wardScope is set and NOT 'ALL'
    const isLockedToSingleWard = user.role === 'WARD' && user.wardScope && user.wardScope !== 'ALL';

    if (isLockedToSingleWard) {
      displayEl.classList.remove('hidden');
      selectEl.classList.add('hidden');
      if (valEl) valEl.textContent = user.wardScope;
    } else {
      // User has access to ALL wards (e.g. wardScope is 'ALL', SUPER_ADMIN, or PHARMACY)
      displayEl.classList.add('hidden');
      selectEl.classList.remove('hidden');

      // Populate select options
      const wards = (App.adminWards && App.adminWards.length > 0)
        ? App.adminWards.map(w => w.name).filter(w => w !== 'ALL')
        : ['ตึกพิเศษ', 'Ward 1', 'Ward 2', 'Ward 3'];

      const currentVal = selectEl.value;
      let optHtml = '';
      wards.forEach(w => {
        optHtml += `<option value="${w}">${w}</option>`;
      });
      selectEl.innerHTML = optHtml;

      if (currentVal && wards.includes(currentVal)) {
        selectEl.value = currentVal;
      }
    }
  },

  /**
   * Populates all Ward Dropdowns dynamically across the whole application
   */
  populateAllWardDropdowns: function(wardNames) {
    if (!wardNames || !Array.isArray(wardNames)) return;

    // 1. Board Filter Dropdown
    const boardWardSelect = document.getElementById('board-ward-filter');
    if (boardWardSelect) {
      const currentVal = boardWardSelect.value;
      let optHtml = '<option value="ALL">ทุก Ward</option>';
      wardNames.forEach(w => {
        optHtml += `<option value="${w}">${w}</option>`;
      });
      boardWardSelect.innerHTML = optHtml;
      if (wardNames.includes(currentVal) || currentVal === 'ALL') {
        boardWardSelect.value = currentVal;
      }
    }

    // 2. Analytics Ward Filter Dropdown
    const analyticsWardSelect = document.getElementById('analytics-ward-filter');
    if (analyticsWardSelect) {
      const currentVal = analyticsWardSelect.value;
      let optHtml = '<option value="ALL">ทุก Ward</option>';
      wardNames.forEach(w => {
        optHtml += `<option value="${w}">${w}</option>`;
      });
      analyticsWardSelect.innerHTML = optHtml;
      if (wardNames.includes(currentVal) || currentVal === 'ALL') {
        analyticsWardSelect.value = currentVal;
      }
    }

    // 3. User Modal Dropdown
    this.populateWardDropdownForModal();

    // 4. Send Patient Ward Field
    this.setupSendPatientWardField();
  },

  populateWardDropdownForModal: function(selectedWard) {
    const userWardSelect = document.getElementById('modal-user-ward');
    if (!userWardSelect) return;

    const wards = App.adminWards && App.adminWards.length > 0 
      ? App.adminWards.map(w => w.name)
      : ['ตึกพิเศษ', 'Ward 1', 'Ward 2', 'Ward 3'];

    let optHtml = '';
    wards.forEach(w => {
      optHtml += `<option value="${w}">${w}</option>`;
    });
    optHtml += '<option value="ALL">ALL (ทุก Ward)</option>';
    userWardSelect.innerHTML = optHtml;

    if (selectedWard) {
      userWardSelect.value = selectedWard;
    }
  },

  // -------------------------------------------------------------------------
  // SLA, TARGET & BREAK SETTINGS
  // -------------------------------------------------------------------------

  /**
   * Loads SLA, Waiting Target & Break settings values into form inputs
   */
  loadAdminSettings: function() {
    this.loadDailyTriggerStatus();
    google.script.run
      .withSuccessHandler(function(settings) {
        if (settings) {
          const targetInput = document.getElementById('setting-waiting-target');
          const normInput = document.getElementById('setting-sla-normal');
          const appInput = document.getElementById('setting-sla-approaching');
          const breakEnabledInput = document.getElementById('setting-break-enabled');
          const breakStartInput = document.getElementById('setting-break-start');
          const breakEndInput = document.getElementById('setting-break-end');

          if (targetInput) targetInput.value = settings.WAITING_TIME_TARGET_MINUTES || '40';
          if (normInput) normInput.value = settings.SLA_NORMAL_MAX || '30';
          if (appInput) appInput.value = settings.SLA_APPROACHING_MAX || '45';
          if (breakEnabledInput) breakEnabledInput.checked = settings.BREAK_TIME_ENABLED !== 'false';
          if (breakStartInput) breakStartInput.value = App.formatTimeString(settings.BREAK_TIME_START, '12:00');
          if (breakEndInput) breakEndInput.value = App.formatTimeString(settings.BREAK_TIME_END, '13:00');
        }
      })
      .apiGetSettingsPublic();
  },

  dailyTriggerEnabled: false,

  /**
   * Loads Daily Automation Trigger live status
   */
  loadDailyTriggerStatus: function() {
    const badge = document.getElementById('trigger-status-badge');
    const desc = document.getElementById('trigger-status-desc');
    const btn = document.getElementById('btn-toggle-daily-trigger');
    const btnText = document.getElementById('btn-toggle-trigger-text');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.data) {
          App.dailyTriggerEnabled = !!res.data.isEnabled;
          if (res.data.requiresOwnerSetup) {
            if (badge) {
              badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#0071e3]/10 text-[#0059b5] flex items-center gap-1.5';
              badge.innerHTML = '<span class="material-symbols-outlined text-xs">info</span> ตั้งค่าผ่าน Apps Script Console';
            }
            if (desc) {
              desc.innerHTML = 'เนื่องจากนโยบายความปลอดภัยของ Google การตั้งค่า Time-driven Trigger ของโปรเจกต์ ต้องดำเนินการโดยเจ้าของโปรเจกต์ (Script Owner) ผ่าน Apps Script Editor: เลือกฟังก์ชัน <code>setupDailyAutomationTrigger</code> แล้วกด <strong>Run</strong>';
            }
            if (btn) {
              btn.className = 'px-4 py-2 bg-[#0071e3] hover:bg-[#0059b5] text-white rounded-lg text-xs font-medium transition-colors shadow-sm flex items-center gap-1.5';
            }
            if (btnText) {
              btnText.textContent = 'ลองเปิดใช้งาน Trigger';
            }
          } else if (App.dailyTriggerEnabled) {
            if (badge) {
              badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#28cd41]/10 text-[#28cd41] flex items-center gap-1.5';
              badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-[#28cd41] animate-pulse"></span> เปิดใช้งานอยู่ (Active)';
            }
            if (desc) {
              desc.innerHTML = 'ระบบตั้งค่า Trigger อัตโนมัติเรียบร้อยแล้ว: จะประมวลผลสรุปยอดและจัดเก็บคลังประวัติทุกวันเวลา <strong>23:55 น.</strong>';
            }
            if (btn) {
              btn.className = 'px-4 py-2 bg-white border border-[#e4e2e4] hover:bg-[#ffdad6] text-[#ba1a1a] rounded-lg text-xs font-medium transition-colors shadow-xs flex items-center gap-1.5';
            }
            if (btnText) {
              btnText.textContent = 'ปิดการใช้งาน Trigger';
            }
          } else {
            if (badge) {
              badge.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-[#ff9f0a]/10 text-[#ff9f0a] flex items-center gap-1.5';
              badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-[#ff9f0a]"></span> ยังไม่ได้เปิดใช้งาน (Inactive)';
            }
            if (desc) {
              desc.innerHTML = 'ขณะนี้ยังไม่มี Script Trigger ที่รันเวลา 23:55 น. ท่านสามารถกดปุ่มเปิดใช้งานเพื่อตั้งค่าอัตโนมัติได้ทันที';
            }
            if (btn) {
              btn.className = 'px-4 py-2 bg-[#0071e3] hover:bg-[#0059b5] text-white rounded-lg text-xs font-medium transition-colors shadow-sm flex items-center gap-1.5';
            }
            if (btnText) {
              btnText.textContent = 'เปิดใช้งาน Trigger 23:55 น.';
            }
          }
        }
      })
      .apiGetDailyTriggerStatus();
  },

  /**
   * Toggles Daily Automation Trigger on/off
   */
  handleToggleDailyTrigger: function() {
    const nextState = !this.dailyTriggerEnabled;
    const actionLabel = nextState ? 'เปิดใช้งาน' : 'ปิดการใช้งาน';
    if (!confirm(`คุณต้องการ${actionLabel}ระบบสรุปยอด & จัดเก็บอัตโนมัติ (เวลา 23:55 น. ของทุกวัน) ใช่หรือไม่?`)) return;

    this.showToast(`กำลัง${actionLabel} Daily Trigger...`, 'info');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.showToast(res.message || `${actionLabel} Daily Trigger สำเร็จ`, 'success');
          App.loadDailyTriggerStatus();
        } else {
          App.showToast('เกิดข้อผิดพลาด: ' + (res ? res.error : 'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast(`ไม่สามารถ${actionLabel}: ` + err.message, 'error');
      })
      .apiToggleDailyTrigger(nextState);
  },

  handleSaveSettings: function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const targetInput = document.getElementById('setting-waiting-target');
    const normalInput = document.getElementById('setting-sla-normal');
    const appInput = document.getElementById('setting-sla-approaching');
    const breakEnabledInput = document.getElementById('setting-break-enabled');
    const breakStartInput = document.getElementById('setting-break-start');
    const breakEndInput = document.getElementById('setting-break-end');

    if (!normalInput || !appInput) return;

    const targetVal = targetInput ? targetInput.value.trim() : '40';
    const normalVal = normalInput.value.trim();
    const appVal = appInput.value.trim();
    const breakEnabled = breakEnabledInput ? String(breakEnabledInput.checked) : 'true';
    const breakStart = breakStartInput ? breakStartInput.value.trim() : '12:00';
    const breakEnd = breakEndInput ? breakEndInput.value.trim() : '13:00';

    if (!targetVal || parseInt(targetVal, 10) <= 0) {
      this.showToast('กรุณากรอกเป้าหมายเวลารอรับยาให้ถูกต้อง (มากกว่า 0 นาที)', 'warning');
      return;
    }

    if (!normalVal || !appVal || parseInt(normalVal, 10) <= 0 || parseInt(appVal, 10) <= 0) {
      this.showToast('กรุณากรอกเกณฑ์เวลา SLA ให้ถูกต้อง (มากกว่า 0 นาที)', 'warning');
      return;
    }

    if (breakEnabled === 'true' && (!breakStart || !breakEnd)) {
      this.showToast('กรุณาระบุเวลาเริ่มต้นและสิ้นสุดการพักให้ครบถ้วน', 'warning');
      return;
    }

    this.showToast('กำลังบันทึกการตั้งค่า...', 'info');

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.showToast('บันทึกการตั้งค่าสำเร็จ', 'success');
        } else {
          App.showToast('เกิดข้อผิดพลาด: ' + (res ? res.error : 'Unknown error'), 'error');
        }
      })
      .withFailureHandler(function(err) {
        App.showToast('ไม่สามารถบันทึกการตั้งค่า: ' + err.message, 'error');
      })
      .apiUpdateSettings({
        WAITING_TIME_TARGET_MINUTES: targetVal,
        SLA_NORMAL_MAX: normalVal,
        SLA_APPROACHING_MAX: appVal,
        BREAK_TIME_ENABLED: breakEnabled,
        BREAK_TIME_START: breakStart,
        BREAK_TIME_END: breakEnd
      });
  }
};

// Initialize Application when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() {
    App.init();
  });
} else {
  App.init();
}
</script>
