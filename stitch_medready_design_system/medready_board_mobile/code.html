<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MedReady Board - Mobile</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration (Injected from Design System) -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "status-critical": "#FF3B30",
                        "on-primary-fixed-variant": "#00458f",
                        "surface-pure": "#FFFFFF",
                        "tertiary-fixed-dim": "#ffb693",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#1a1c1d",
                        "surface-container-highest": "#e4e2e4",
                        "status-warning": "#FF9F0A",
                        "outline-variant": "#c1c6d6",
                        "inverse-surface": "#303032",
                        "background": "#fcf8fb",
                        "tertiary-fixed": "#ffdbcb",
                        "surface-tint": "#005cbb",
                        "surface-bright": "#fcf8fb",
                        "on-surface-variant": "#414753",
                        "on-primary-container": "#fcfbff",
                        "primary-fixed-dim": "#abc7ff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "on-secondary-fixed-variant": "#454749",
                        "on-primary-fixed": "#001b3f",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "status-ready": "#28CD41",
                        "on-tertiary-fixed-variant": "#7a3000",
                        "primary": "#0059b5",
                        "on-primary": "#ffffff",
                        "border-subtle": "#D2D2D7",
                        "on-secondary-container": "#616365",
                        "surface-container-high": "#eae7ea",
                        "surface": "#fcf8fb",
                        "secondary-fixed-dim": "#c6c6c8",
                        "surface-container": "#f0edef",
                        "tertiary": "#9b3f00",
                        "secondary-container": "#dfdfe1",
                        "on-tertiary-container": "#fffaf9",
                        "secondary-fixed": "#e2e2e4",
                        "primary-container": "#0071e3",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#d7e2ff",
                        "tertiary-container": "#c25100",
                        "surface-variant": "#e4e2e4",
                        "secondary": "#5d5e60",
                        "on-background": "#1b1b1d",
                        "surface-container-low": "#f6f3f5",
                        "on-error-container": "#93000a",
                        "text-muted": "#86868B",
                        "surface-dim": "#dcd9dc",
                        "on-tertiary-fixed": "#341000",
                        "outline": "#717785",
                        "inverse-primary": "#abc7ff",
                        "on-surface": "#1b1b1d",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-max": "1200px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Be Vietnam Pro"],
                        "label-caps": ["Hanken Grotesk"],
                        "display-id": ["Hanken Grotesk"],
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-md": ["Hanken Grotesk"],
                        "numeric-data": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-id": ["44px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "numeric-data": ["19px", { "lineHeight": "24px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #F5F5F7; /* Level 0 Canvas */
        }
        /* Custom scrollbar hiding for cleaner mobile view */
        ::-webkit-scrollbar {
            display: none;
        }
        .card-surface {
            background-color: #FFFFFF;
            border: 1px solid #D2D2D7;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased pb-24 md:pb-0 min-h-screen flex flex-col">
<!-- Top Navigation (Mobile Search/Filter Area) -->
<header class="sticky top-0 z-40 bg-surface-pure/90 backdrop-blur-xl border-b border-border-subtle shadow-sm px-margin-mobile py-4 w-full">
<div class="flex items-center justify-between mb-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">MedReady Board</h1>
<div class="flex gap-2">
<button aria-label="Filter" class="w-[44px] h-[44px] flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">filter_list</span>
</button>
</div>
</div>
<!-- Search Input -->
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-b border-border-subtle focus:border-primary focus:border-b-2 focus:ring-0 rounded-t-lg transition-all font-body-md text-body-md text-on-surface placeholder-text-muted" placeholder="Search Patient or Case ID..." type="text"/>
</div>
<!-- Quick Filters -->
<div class="flex gap-2 mt-4 overflow-x-auto pb-1">
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-primary text-on-primary font-label-caps text-label-caps">All Cases</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container border border-border-subtle text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-highest">Awaiting Review</button>
<button class="whitespace-nowrap px-4 py-2 rounded-full bg-surface-container border border-border-subtle text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-highest">Pharmacy Prep</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile py-6 flex flex-col gap-4">
<!-- Case Card 1 (Warning State) -->
<article class="card-surface rounded-xl overflow-hidden relative group active:scale-[0.99] transition-transform">
<!-- Status Strip -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-status-warning"></div>
<div class="p-4 pl-5">
<div class="flex justify-between items-start mb-3">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="font-numeric-data text-numeric-data text-on-surface">MR-8492</span>
<span class="px-2 py-0.5 rounded-full bg-[#FFF5E6] text-status-warning font-label-caps text-[10px] border border-[#FFE0B2]">SLA WARNING</span>
</div>
<div class="text-text-muted font-body-md text-body-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">bed</span> Ward 4B • Bed 12
                        </div>
</div>
<div class="text-right">
<div class="font-numeric-data text-numeric-data text-status-warning">45m</div>
<div class="font-label-caps text-label-caps text-text-muted">Elapsed</div>
</div>
</div>
<div class="text-on-surface font-body-md text-body-md mb-4 font-medium">
                    Pt: ***-**-4921
                </div>
<!-- 5-Step Progression (Linear) -->
<div class="mb-5">
<div class="flex justify-between text-[10px] font-label-caps text-text-muted mb-1 px-1">
<span>Req</span>
<span>Prep</span>
<span class="text-status-warning font-bold">Review</span>
<span>Disp</span>
<span>Admin</span>
</div>
<div class="flex items-center gap-1">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-status-warning rounded-full animate-pulse"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
</div>
<div class="flex justify-end pt-2 border-t border-border-subtle">
<button class="h-[44px] px-6 bg-primary-container text-on-primary rounded-lg font-body-md text-body-md font-medium active:bg-primary-fixed-dim transition-colors flex items-center gap-2">
                        Review Case <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</article>
<!-- Case Card 2 (Ready State) -->
<article class="card-surface rounded-xl overflow-hidden relative group active:scale-[0.99] transition-transform">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-status-ready"></div>
<div class="p-4 pl-5">
<div class="flex justify-between items-start mb-3">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="font-numeric-data text-numeric-data text-on-surface">MR-8493</span>
<span class="px-2 py-0.5 rounded-full bg-[#E8F5E9] text-status-ready font-label-caps text-[10px] border border-[#C8E6C9]">READY</span>
</div>
<div class="text-text-muted font-body-md text-body-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">bed</span> ICU • Bed 04
                        </div>
</div>
<div class="text-right">
<div class="font-numeric-data text-numeric-data text-on-surface">12m</div>
<div class="font-label-caps text-label-caps text-text-muted">Elapsed</div>
</div>
</div>
<div class="text-on-surface font-body-md text-body-md mb-4 font-medium">
                    Pt: ***-**-1102
                </div>
<div class="mb-5">
<div class="flex justify-between text-[10px] font-label-caps text-text-muted mb-1 px-1">
<span>Req</span>
<span>Prep</span>
<span>Review</span>
<span class="text-status-ready font-bold">Disp</span>
<span>Admin</span>
</div>
<div class="flex items-center gap-1">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-status-ready rounded-full"></div>
<div class="h-1 flex-1 bg-surface-container-highest rounded-full"></div>
</div>
</div>
<div class="flex justify-end gap-3 pt-2 border-t border-border-subtle">
<button class="h-[44px] px-4 bg-surface-container text-primary rounded-lg font-body-md text-body-md font-medium active:bg-surface-container-highest transition-colors">
                        Details
                    </button>
<button class="h-[44px] px-6 bg-primary-container text-on-primary rounded-lg font-body-md text-body-md font-medium active:bg-primary-fixed-dim transition-colors flex items-center gap-2">
                        Mark Administered <span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</div>
</article>
</main>
<!-- Bottom Navigation Bar (Mobile Shell) -->
<!-- Applying Active State Logic: Context is "MedReady Board", closest match is "Board" -->
<nav aria-label="Bottom Navigation" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe md:hidden bg-surface-pure/90 backdrop-blur-lg border-t border-border-subtle shadow-lg">
<!-- Dashboard (Inactive) -->
<button class="flex flex-col items-center justify-center text-text-muted active:bg-surface-container-highest rounded-xl px-3 py-1 transition-colors w-[72px] h-[56px]">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-caps text-label-caps">Dashboard</span>
</button>
<!-- Send (Inactive) -->
<button class="flex flex-col items-center justify-center text-text-muted active:bg-surface-container-highest rounded-xl px-3 py-1 transition-colors w-[72px] h-[56px]">
<span class="material-symbols-outlined mb-1">send</span>
<span class="font-label-caps text-label-caps">Send</span>
</button>
<!-- Board (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-3 py-1 active:scale-95 transition-transform w-[72px] h-[56px]">
<span class="material-symbols-outlined filled mb-1">view_kanban</span>
<span class="font-label-caps text-label-caps">Board</span>
</button>
<!-- Alerts (Inactive) -->
<button class="flex flex-col items-center justify-center text-text-muted active:bg-surface-container-highest rounded-xl px-3 py-1 transition-colors w-[72px] h-[56px] relative">
<span class="material-symbols-outlined mb-1">notifications</span>
<span class="font-label-caps text-label-caps">Alerts</span>
<!-- Unread Badge -->
<span class="absolute top-1 right-5 w-2 h-2 bg-status-critical rounded-full"></span>
</button>
</nav>
<!-- Safe area padding for iOS -->
<style>
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</body></html>
