<style>
        .glass-header {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-color: rgba(255, 255, 255, 0.8);
        }
        
        .floating-label-input:focus + label,
        .floating-label-input:not(:placeholder-shown) + label {
            transform: translateY(-130%) scale(0.85);
            color: #0071e3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-16 pb-24 lg:pb-0 md:pt-20">
<!-- Top Navigation Bar (Mobile / Back Button Context) -->
<header class="fixed top-0 left-0 w-full z-50 glass-header border-b border-border-subtle h-16 flex items-center px-margin-mobile">
<button aria-label="Go back" class="text-primary hover:opacity-70 transition-opacity flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface ml-2 flex-grow text-center pr-8">
            ส่งตัวผู้ป่วยไปที่ห้องยา
        </h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-6">
<form class="space-y-6">
<!-- Patient Identification Section -->
<section class="bg-surface-pure border border-border-subtle rounded-xl p-4 shadow-sm relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<h2 class="font-label-caps text-label-caps text-secondary mb-4 uppercase tracking-wider">Patient Details</h2>
<div class="space-y-5">
<!-- Patient Name -->
<div class="relative">
<input class="floating-label-input block w-full bg-transparent border-0 border-b border-border-subtle focus:ring-0 focus:border-primary-container pb-2 pt-4 px-0 text-on-surface transition-colors duration-200 peer" id="patientName" placeholder=" " type="text">
<label class="absolute top-4 left-0 text-text-muted transition-all duration-200 pointer-events-none origin-left" for="patientName">Patient Name (Optional)</label>
</div>
<!-- Admission Number (AN) -->
<div class="relative">
<input class="floating-label-input block w-full bg-transparent border-0 border-b border-border-subtle focus:ring-0 focus:border-primary-container pb-2 pt-4 px-0 text-on-surface transition-colors duration-200 peer" id="anNumber" placeholder=" " required="" type="text">
<label class="absolute top-4 left-0 text-text-muted transition-all duration-200 pointer-events-none origin-left" for="anNumber">AN (Admission Number) *</label>
</div>
</div>
</section>
<!-- Location Details Section -->
<section class="bg-surface-pure border border-border-subtle rounded-xl p-4 shadow-sm">
<h2 class="font-label-caps text-label-caps text-secondary mb-4 uppercase tracking-wider">Location</h2>
<div class="space-y-5">
<!-- Ward / Building (Locked) -->
<div class="relative bg-surface-container-low rounded-lg p-3 border border-border-subtle flex items-center justify-between opacity-80 cursor-not-allowed">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-text-muted uppercase">Ward / Building</span>
<span class="font-body-md text-on-surface mt-1">ตึกพิเศษ</span>
</div>
<span aria-label="Locked field" class="material-symbols-outlined text-text-muted">lock</span>
</div>
<!-- Room / Bed Selection -->
<div class="space-y-4">
<div class="relative">
<select class="floating-label-input block w-full bg-transparent border-0 border-b border-border-subtle focus:ring-0 focus:border-primary-container pb-2 pt-4 px-0 text-on-surface transition-colors duration-200 peer appearance-none cursor-pointer" id="roomNumber" required=""><option value="" disabled="" selected="" hidden=""></option><option value="EX01">EX01</option><option value="EX02">EX02</option><option value="EX03">EX03</option><option value="EX04">EX04</option><option value="EX05">EX05</option><option value="EX06">EX06</option><option value="EX07">EX07</option><option value="EX08">EX08</option><option value="EX09">EX09</option><option value="EX10">EX10</option><option value="EX11">EX11</option><option value="EX12">EX12</option><option value="EX13">EX13</option><option value="EX14">EX14</option><option value="EX15">EX15</option><option value="EX16">EX16</option><option value="EX17">EX17</option><option value="EX18">EX18</option><option value="EX19">EX19</option><option value="EX20">EX20</option><option value="EX21">EX21</option><option value="EX22">EX22</option><option value="EX23">EX23</option><option value="EX24">EX24</option><option value="EX25">EX25</option><option value="EX26">EX26</option><option value="EX27">EX27</option><option value="EX28">EX28</option><option value="EX29">EX29</option><option value="EX30">EX30</option></select>
<label class="absolute top-4 left-0 text-text-muted transition-all duration-200 pointer-events-none origin-left" for="roomNumber">Room (EX01 - EX30)</label>
<p class="text-label-caps text-text-muted mt-1">Valid range for ตึกพิเศษ: EX01 - EX30</p>
</div>
</div>
</div>
</section>
<!-- Priority & Schedule Section -->
<section class="bg-surface-pure border border-border-subtle rounded-xl p-4 shadow-sm">
<h2 class="font-label-caps text-label-caps text-secondary mb-4 uppercase tracking-wider">Discharge Details</h2>
<!-- Priority Level -->
<div class="mb-6">
<span class="block font-label-caps text-label-caps text-text-muted uppercase mb-3">Priority Level</span>
<div class="flex flex-col space-y-3">
<label class="flex items-center space-x-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" name="priority" type="radio" value="standard">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary-container peer-checked:bg-primary-container transition-colors"></div>
<div class="absolute w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-on-surface group-hover:text-primary transition-colors">Standard Discharge</span>
</label>
<label class="flex items-center space-x-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer sr-only" name="priority" type="radio" value="urgent">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-status-warning peer-checked:bg-status-warning transition-colors"></div>
<div class="absolute w-2 h-2 rounded-full bg-white opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
<span class="font-body-md text-on-surface group-hover:text-status-warning transition-colors">Urgent Request</span>
</label>
</div>
</div>
<!-- Schedule Picker -->
<div class="space-y-4">
<div class="relative">
<input class="block w-full bg-surface-container-low border border-border-subtle rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent py-2.5 px-3 text-on-surface transition-shadow duration-200" id="dischargeSchedule" type="datetime-local">
</div>
</div>
</section>
<!-- Special Instructions -->
<section class="bg-surface-pure border border-border-subtle rounded-xl p-4 shadow-sm">
<h2 class="font-label-caps text-label-caps text-secondary mb-4 uppercase tracking-wider">Instructions</h2>
<div class="relative">
<textarea class="block w-full bg-transparent border border-border-subtle rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent p-3 text-on-surface transition-shadow duration-200 resize-none font-body-md" id="specialInstructions" placeholder="Enter any special instructions or notes..." rows="3"></textarea>
</div>
</section>
<!-- Action Buttons -->
<div class="flex flex-col space-y-3 pt-4">
<button class="w-full bg-primary-container text-on-primary-container font-body-md font-semibold py-3.5 px-4 rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center" type="submit">
                    ส่งคำขอ / Submit Request
                </button>
<button class="w-full bg-secondary-fixed text-on-secondary-fixed-variant font-body-md font-medium py-3.5 px-4 rounded-xl hover:bg-surface-container-highest active:scale-[0.98] transition-all" type="button">
                    Cancel
                </button>
</div>
</form>
</main>
<!-- Suppressed Global Navigation Nav (Because this is a transactional form, we suppress the navigation shell as per mandate) -->






</body></html>
