<body class="bg-surface-bright min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<!-- Background Pattern/Atmosphere (Subtle) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden flex justify-center items-center opacity-30 z-0">
<div class="absolute w-[800px] h-[800px] bg-primary-fixed rounded-full blur-[120px] mix-blend-multiply opacity-50 top-[-200px] right-[-200px]"></div>
<div class="absolute w-[600px] h-[600px] bg-secondary-container rounded-full blur-[100px] mix-blend-multiply opacity-50 bottom-[-100px] left-[-100px]"></div>
</div>
<!-- Main Authentication Card -->
<div class="relative z-10 w-full max-w-md bg-surface-pure rounded-2xl shadow-sm border border-border-subtle p-8 md:p-10 flex flex-col items-center">
<!-- Logo & Branding -->
<div class="flex flex-col items-center text-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-6 shadow-md shadow-primary-container/20">
<span class="material-symbols-outlined text-on-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    medical_services
                </span>
</div>
<h1 class="font-display-id text-display-id text-primary mb-2">MedReady</h1>
<p class="font-body-md text-body-md text-text-muted">
                รู้เมื่อยาเสร็จ ลดเวลารอ เชื่อม Ward กับ Pharmacy
            </p>
</div>
<!-- Google Auth Button -->
<div class="w-full mb-8">
<button class="w-full flex items-center justify-center gap-3 bg-surface-pure border border-border-subtle hover:bg-surface-container-low transition-colors duration-200 rounded-lg py-3 px-4 shadow-[0_2px_4px_rgba(0,0,0,0.02)]">
<!-- Google G Logo SVG -->
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-headline-md text-headline-md text-on-surface">Sign in with Google</span>
</button>
</div>
<!-- Security Note -->
<div class="mt-4 text-center border-t border-border-subtle pt-6 w-full">
<span class="material-symbols-outlined text-text-muted text-xl mb-2">
                lock
            </span>
<p class="font-label-caps text-label-caps text-text-muted uppercase tracking-wider">
                Internal System Only
            </p>
<p class="font-body-md text-[13px] leading-snug text-text-muted mt-2">
                ระบบนี้สงวนสิทธิ์เฉพาะบุคลากรทางการแพทย์ที่ได้รับอนุญาตเท่านั้น<br/>
                Unauthorized access is strictly prohibited.
            </p>
</div>
</div>
<!-- Interaction Script -->
<script>
        // Simple subtle entrance animation for the card
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.querySelector('.z-10');
            card.style.opacity = '0';
            card.style.transform = 'translateY(10px)';
            card.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
