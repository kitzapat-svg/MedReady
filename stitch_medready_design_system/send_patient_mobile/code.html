<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>MedReady - Send Patient</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#fcf8fb",
                    "inverse-surface": "#303032",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e4e2e4",
                    "primary-container": "#0071e3",
                    "surface-container": "#f0edef",
                    "tertiary-fixed": "#ffdbcb",
                    "surface-container-low": "#f6f3f5",
                    "on-tertiary-container": "#fffaf9",
                    "on-primary-fixed": "#001b3f",
                    "on-background": "#1b1b1d",
                    "secondary-fixed-dim": "#c6c6c8",
                    "on-secondary-fixed": "#1a1c1d",
                    "on-primary-container": "#fcfbff",
                    "outline": "#717785",
                    "text-muted": "#86868B",
                    "surface-tint": "#005cbb",
                    "on-surface": "#1b1b1d",
                    "on-tertiary-fixed": "#341000",
                    "surface-container-high": "#eae7ea",
                    "secondary-fixed": "#e2e2e4",
                    "on-secondary-fixed-variant": "#454749",
                    "tertiary-container": "#c25100",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#ffb693",
                    "inverse-on-surface": "#f3f0f2",
                    "background": "#fcf8fb",
                    "secondary": "#5d5e60",
                    "surface-bright": "#fcf8fb",
                    "inverse-primary": "#abc7ff",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#7a3000",
                    "primary-fixed-dim": "#abc7ff",
                    "primary-fixed": "#d7e2ff",
                    "on-secondary-container": "#616365",
                    "surface-pure": "#FFFFFF",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#dcd9dc",
                    "secondary-container": "#dfdfe1",
                    "error": "#ba1a1a",
                    "status-ready": "#28CD41",
                    "surface-variant": "#e4e2e4",
                    "outline-variant": "#c1c6d6",
                    "on-primary-fixed-variant": "#00458f",
                    "status-warning": "#FF9F0A",
                    "primary": "#0059b5",
                    "status-critical": "#FF3B30",
                    "border-subtle": "#D2D2D7",
                    "error-container": "#ffdad6",
                    "on-surface-variant": "#414753",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#9b3f00",
                    "on-error-container": "#93000a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "margin-mobile": "20px",
                    "unit": "8px",
                    "margin-desktop": "40px",
                    "container-max": "1200px",
                    "safe": "env(safe-area-inset-bottom)"
            },
            "fontFamily": {
                    "numeric-data": ["Hanken Grotesk"],
                    "body-lg": ["Be Vietnam Pro"],
                    "display-id": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "body-md": ["Be Vietnam Pro"],
                    "label-caps": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "numeric-data": ["19px", { "lineHeight": "24px", "fontWeight": "500" }],
                    "body-lg": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
                    "display-id": ["44px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                    "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                    "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "600" }],
                    "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                    "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased pb-[100px] pt-[64px]">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 max-w-container-max mx-auto backdrop-blur-xl bg-white/80 border-b border-border-subtle shadow-sm">
<div class="flex items-center gap-2 text-primary cursor-pointer active:opacity-70 transition-opacity" onclick="history.back()">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 0;">arrow_back_ios</span>
<span class="font-body-md text-body-md font-semibold">Back</span>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary">Send Patient</div>
<div class="w-16"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="max-w-md mx-auto px-margin-mobile py-6 flex flex-col gap-6">
<!-- Header -->
<div class="flex flex-col gap-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Send Patient</h1>
<p class="font-body-md text-body-md text-text-muted">Enter details to initiate transfer.</p>
</div>
<!-- Form Form -->
<form class="flex flex-col gap-6">
<!-- AN Field (Scannable) -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wide">Admission Number (AN)</label>
<div class="relative">
<input class="w-full bg-surface-pure border border-border-subtle rounded-lg px-4 py-3 font-numeric-data text-numeric-data text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-secondary-fixed-dim" placeholder="Scan or enter AN..." type="text"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-primary hover:text-primary-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
</button>
</div>
</div>
<!-- Room/Bed Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wide">Room / Bed</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-pure border border-border-subtle rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
<option disabled="" selected="" value="">Select Room/Bed</option>
<option value="w1-101">Ward 1 - Bed 101</option>
<option value="w1-102">Ward 1 - Bed 102</option>
<option value="w2-201">Ward 2 - Bed 201</option>
<option value="icu-01">ICU - Bed 01</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Urgent Toggle -->
<div class="flex items-center justify-between bg-surface-pure border border-border-subtle rounded-lg p-4">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg font-semibold text-status-critical">Urgent Transfer</span>
<span class="font-body-md text-body-md text-text-muted">Requires immediate attention</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-error-container rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-border-subtle after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-status-critical"></div>
</label>
</div>
<!-- Discharge Time Selector -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wide">Expected Transfer Time</label>
<input class="w-full bg-surface-pure border border-border-subtle rounded-lg px-4 py-3 font-numeric-data text-numeric-data text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" type="time"/>
</div>
<!-- Quick Notes -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wide">Quick Notes</label>
<div class="flex flex-wrap gap-2">
<button class="bg-surface-variant text-on-surface-variant font-body-md text-body-md px-4 py-2 rounded-full border border-transparent hover:border-primary hover:text-primary transition-colors active:scale-95" type="button">Relative waiting</button>
<button class="bg-surface-variant text-on-surface-variant font-body-md text-body-md px-4 py-2 rounded-full border border-transparent hover:border-primary hover:text-primary transition-colors active:scale-95" type="button">Bring home meds</button>
<button class="bg-surface-variant text-on-surface-variant font-body-md text-body-md px-4 py-2 rounded-full border border-transparent hover:border-primary hover:text-primary transition-colors active:scale-95" type="button">Needs wheelchair</button>
<button class="bg-surface-variant text-on-surface-variant font-body-md text-body-md px-4 py-2 rounded-full border border-transparent hover:border-primary hover:text-primary transition-colors active:scale-95" type="button">Oxygen required</button>
</div>
<textarea class="mt-2 w-full bg-surface-pure border border-border-subtle rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors min-h-[100px] resize-none" placeholder="Additional notes..."></textarea>
</div>
</form>
</main>
<!-- Bottom Submit Button (Fixed) -->
<div class="fixed bottom-[80px] left-0 w-full px-margin-mobile py-4 bg-background/90 backdrop-blur-sm border-t border-border-subtle/50 z-40">
<button class="w-full bg-primary text-white font-headline-md text-headline-md py-4 rounded-xl shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2" type="button">
<span>ส่งคำขอ / Submit</span>
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
<!-- Bottom Navigation Bar (Shell - Suppressed due to task-focused intent, but requested in prompt, so including minimal version) -->
<!-- Note: Task focus usually suppresses this, but prompt explicitly asks for "Use the BottomNavBar with 'Send' as the active tab". -->
<!-- We adapt the JSON bottom nav. -->
<nav class="lg:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile pb-safe h-20 bg-surface border-t border-border-subtle shadow-sm rounded-t-xl">
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-text-muted px-4 py-1 hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 0;">domain</span>
<span class="font-label-caps text-label-caps mt-1">Ward</span>
</a>
<!-- Active Tab (Send) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-1 hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 1;">send</span>
<span class="font-label-caps text-label-caps mt-1">Send</span>
</a>
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-text-muted px-4 py-1 hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined font-variation-settings: 'FILL' 0;">local_pharmacy</span>
<span class="font-label-caps text-label-caps mt-1">Pharmacy</span>
</a>
</nav>
<script>
        // Simple JS for quick notes toggle
        document.querySelectorAll('.rounded-full').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('bg-surface-variant');
                this.classList.toggle('bg-primary-container/20');
                this.classList.toggle('border-primary');
                this.classList.toggle('text-primary');
            });
        });
    </script>
</body></html>
